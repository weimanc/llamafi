ceiling:                     # RAM pool available to overlays + headroom, per caps class
  INTERNAL: 290000           # bytes — EXP-009 ~320 K pool minus ~30 K WiFi/LWIP always-resident (estimate)
  DMA:      48000
headroom:                    # reserved for transient heap the planner does NOT place (TLS, system)
  INTERNAL: 60000            # ~40 K mbedtls fetch context + margin; EXP-010 TASK-267 lfbInt=61 K confirms bound
buffers:
  # OQ1 (TASK-268): the decoder+InBuff overlay the heap-resident fetch TLS, which the
  # planner can't place — so they are placement:runtime (BUDGETED against the ceiling,
  # but NOT statically placed; they stay runtime-JIT in WebRadioApp::_play()). M-MEMPLAN §6/§10.
  - { name: webradio_decoder, app: WebRadio, caps: INTERNAL, group: foreground, size: 23216, kind: scratch, placement: runtime }
  # EXP-010 Phase 2: arenaHWM = 23216 B (exact sum of 9 Helix structs); see EXP-010 §Phase 2
  - { name: webradio_inbuf,   app: WebRadio, caps: INTERNAL, group: foreground, size: 6400,  kind: scratch, placement: runtime }
  # Audio.cpp:59 calloc(m_buffSize); boot log: 6399 B, rounded; in general heap
  # Phase-2 overlay tenants (TASK-269): two fork-free ArduinoJson parse buffers — mutually
  # exclusive (dataTask is serial + Stock/Crypto are foreground), result copied to a separate
  # struct so the doc is pure scratch. (aquarium_strip deferred — TFT_eSprite has no external-
  # buffer API → needs a TFT_eSPI fork; see TASK-270.)
  - { name: heatmap_doc,      app: Stock,    caps: ANY,      group: foreground, size: 2560,  kind: scratch }
  # dataTaskStorage.cpp:616 — static DynamicJsonDocument s_heatmapDoc(2560); result → s_heatmapResult
  - { name: crypto_doc,       app: Crypto,   caps: ANY,      group: foreground, size: 2048,  kind: scratch }
  # dataTaskStorage.cpp:236 — DynamicJsonDocument doc(2048) in fetchCrypto(); result → s_cryptoResult
  - { name: planeradar_doc,   app: PlaneRadar, caps: ANY,    group: foreground, size: 4096,  kind: scratch }
  # dataTaskStorage.cpp prParseStream() — reused per-object chunked-parse doc, ~4 KB measured
  # peak independent of traffic (ADR-048 D1(b')); result → s_planeRadarResult (fixed array).
  # Same exclusivity argument as heatmap/crypto: dataTask is serial, doc is pure scratch.
  # Registered late — shipped M-PLANERADAR without a manifest entry (LL-111).
