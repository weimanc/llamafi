[platformio]
src_dir = src
default_envs = cyd2usb_winamp

[env]
platform = espressif32@6.9.0
board    = esp32dev
framework = arduino
; SpotifyArduino vendored in app/lib/ — LOCAL_PATCHES preserved (see LOCAL_PATCHES.md).
; Upstream headers (spotifyLogic.h, cheapYellowLCD.h, etc.) resolved via lib_extra_dirs.
lib_deps =
    khoih-prog/ESP_DoubleResetDetector@^1.3.2
    bblanchon/ArduinoJson@^6.21.3
    wnatth3/WiFiManager@^2.0.16-rc.2
    https://github.com/witnessmenow/Seeed_Arduino_NFC.git
; lib_extra_dirs: upstream lib/ dir — lets LDF discover libs added to Spotify-Diy-Thing/lib/
;   by future upstream pulls. app/lib/ is auto-scanned (SpotifyArduino + SpotifyDiyThingUpstream
;   symlink live there); no extra_dirs entry needed for our project libs.
; NOTE: SpotifyDiyThingUpstream is a symlink in app/lib/ pointing to
;   ../../Spotify-Diy-Thing/SpotifyDiyThing — this makes PlatformIO scan upstream headers
;   as a proper library (LDF follows transitive deps; .ino files are ignored in lib dirs).
lib_extra_dirs =
    ../Spotify-Diy-Thing/lib
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_ldf_mode = deep+

[common_cyd]
lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI@^2.5.33
build_flags =
    -I.
    -DYELLOW_DISPLAY
    -DUSER_SETUP_LOADED
    -DILI9341_2_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_BACKLIGHT_OFF=LOW
    -DLOAD_GLCD
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF
    -DUSE_HSPI_PORT
    -DSPOTIFY_MARKET=\"IE\"

[env:cyd2usb]
board_build.partitions = ../Spotify-Diy-Thing/partitions_no_ota.csv
lib_deps =
    ${common_cyd.lib_deps}
build_flags =
    ${common_cyd.build_flags}
    -DTFT_INVERSION_ON
    -DCORE_DEBUG_LEVEL=4

[env:cyd2usb_winamp]
extends = env:cyd2usb
build_flags =
    ${env:cyd2usb.build_flags}
    -DWINAMP_DISPLAY
lib_ignore = JPEGDEC

[env:cyd2usb_winamp_screenlog]
extends = env:cyd2usb_winamp
build_flags =
    ${env:cyd2usb_winamp.build_flags}
    -DSCREEN_LOG

[env:cyd2usb_winamp_debug]
extends      = env:cyd2usb_winamp
extra_scripts = pre:scripts/inject_git_hash.py
build_flags =
    ${env:cyd2usb_winamp.build_flags}
    -DSERIAL_DEBUG
    -DTOUCH_DEBUG_OVERLAY
