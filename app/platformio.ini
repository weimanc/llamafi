[platformio]
src_dir = src
default_envs = cyd2usb_winamp

[env]
platform = espressif32@6.9.0
board    = esp32dev
framework = arduino
; SpotifyArduino vendored in app/lib/ — LOCAL_PATCHES preserved (see LOCAL_PATCHES.md).
; Upstream headers (spotifyLogic.h, cheapYellowLCD.h, etc.) resolved via lib_extra_dirs.
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    https://github.com/witnessmenow/Seeed_Arduino_NFC.git
; app/lib/ is auto-scanned: SpotifyArduino + SpotifyDiyThingUpstream (vendored upstream headers)
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_ldf_mode = deep+

[common_cyd]
lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI@^2.5.33
build_flags =
    -I.
    -DYELLOW_DISPLAY
    -DUSER_SETUP_LOADED
    -DILI9341_2_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_BACKLIGHT_OFF=LOW
    -DLOAD_GLCD
    -DSPI_FREQUENCY=40000000
    ; TASK-340: was 20000000. At 20MHz, tft.readRect() MISO reads were
    ; unreliable on this board's wiring/silicon (signal-integrity/timing
    ; fault, not a logic bug) — bit errors on non-flat content produced
    ; readback colours matching no clean channel permutation. DUT-confirmed
    ; via `colorprobe` (main.cpp cmdColorProbe): at 2500000 (matches the
    ; already-proven-safe SPI_TOUCH_FREQUENCY below), a full known-value
    ; sweep read back exactly clean 25/25, matching TFT_eSPI's documented
    ; pushRect()-compat byte swap with zero noise. 1000000 was also clean;
    ; 2500000 kept as the smaller change with margin. See tasks.md TASK-340.
    -DSPI_READ_FREQUENCY=2500000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF
    -DUSE_HSPI_PORT
    -DSPOTIFY_MARKET=\"IE\"
    -DARDUINO_LOOP_STACK_SIZE=20480

[env:cyd2usb]
board_build.partitions = partitions_no_ota.csv
lib_deps =
    ${common_cyd.lib_deps}
build_flags =
    ${common_cyd.build_flags}
    -DTFT_INVERSION_ON
    -DCORE_DEBUG_LEVEL=4

[env:cyd2usb_winamp]
extends = env:cyd2usb
build_flags =
    ${env:cyd2usb.build_flags}
    -DWINAMP_DISPLAY
    -DAUDIO_NO_SD_FS
    ; TASK-262 (A-lite PROMOTED 2026-06-29): the WebRadio decoder arena ships in
    ; production. MEMBUDGET_PHASE1 now enables the JIT mb_arena (acquired in
    ; WebRadioApp::_play, released on suspend) + the halved-DMA fork (PATCH-MEMBUDGET-4).
    ; WebRadio-scoped: Spotify has no audio/I2S path, so this changes no Spotify runtime
    ; behaviour. The verbose [membudget] probes are separately SERIAL_DEBUG-gated.
    ; Provisional: Spotify-PLAYING coexistence render unconfirmed (TASK-243 Premium) —
    ; nil risk (no Spotify code changes). Revert via TASK-256 if needed.
    -DMEMBUDGET_PHASE1
lib_deps =
    ${env:cyd2usb.lib_deps}
    ; ESP32-audioI2S v2.3.0 — vendored into app/lib/ESP32-audioI2S/ (TASK-261 Phase 2).
    ; Local lib/ copy is picked up automatically; registry entry removed to avoid conflict.
    ; DO NOT bump to v3.x: allocates ~704 KB at boot → instant crash on no-PSRAM CYD.
    ; See EXP-008 / EXP-009 / BP-042. Fork's arena is enabled via MEMBUDGET_PHASE1 (above).
lib_ignore = JPEGDEC
             SD_MMC

[env:cyd2usb_winamp_screenlog]
extends = env:cyd2usb_winamp
build_flags =
    ${env:cyd2usb_winamp.build_flags}
    -DSCREEN_LOG

; TASK-255 (M-WEBRADIO-NOPSRAM): Spotify-disabled experiment variant. -DDISABLE_SPOTIFY
; (presence flag — never =0, LL-006) skips spotifyTask::begin() to free RAM for the
; no-PSRAM WebRadio decoder. Experiment on rnd/webradio-nopsram; not for production.
; Inherits debug instrumentation via extends=...debug so the harness can drive it.
[env:cyd2usb_webradio]
extends = env:cyd2usb_winamp_debug
build_flags =
    ${env:cyd2usb_winamp_debug.build_flags}
    -DDISABLE_SPOTIFY
    -DWEBRADIO_ONLY
    ; OQ1 experiment (rnd/memplan branch only) — COMPLETED, flag removed.
    ; Verdict: static-always 23216 B BSS decoder → maxBlk=37K < 40K TLS → SSL -32512 → wrCount=0.
    ; Decoder must stay runtime-JIT (kind: scratch, placement: runtime). See EXP-011.

; EXP-012: 16K input-ring trial (webradio env + WR_INBUF_16K). Experiment-only —
; flash via PORT=... pio run -e cyd2usb_webradio_16k -t upload; never production.
[env:cyd2usb_webradio_16k]
extends = env:cyd2usb_webradio
build_flags =
    ${env:cyd2usb_webradio.build_flags}
    -DWR_INBUF_16K

[env:cyd2usb_winamp_debug]
extends      = env:cyd2usb_winamp
extra_scripts = pre:scripts/inject_git_hash.py
build_flags =
    ${env:cyd2usb_winamp.build_flags}
    -DSERIAL_DEBUG
    -DTOUCH_DEBUG_OVERLAY
    -DCORE_DEBUG_LEVEL=1
    ; MEMBUDGET_PHASE1 is inherited from cyd2usb_winamp (TASK-262 promotion 2026-06-29).
    ; SERIAL_DEBUG (above) additionally enables the verbose [membudget] heap probes.

; Quiet debug build for local DUT iteration (screendump/UI work) — all apps
; present (Clock, WebRadio, etc.), just no spotifyTask (no token-refresh/TLS/
; poll log chatter competing on Serial with whatever else is being tested).
; Reuses the existing -DDISABLE_SPOTIFY flag (TASK-255/M-WEBRADIO-NOPSRAM) —
; the harness's Dut class already fast-paths readiness via `get variant` for
; this flag, skipping the Spotify-poll wait entirely. Not cyd2usb_webradio:
; that env also sets WEBRADIO_ONLY (an unrelated no-PSRAM memory-budget trim
; tied to a different R&D experiment) — this env is deliberately just
; cyd2usb_winamp_debug minus Spotify, nothing else changed.
[env:cyd2usb_winamp_debug_noSpotify]
extends = env:cyd2usb_winamp_debug
build_flags =
    ${env:cyd2usb_winamp_debug.build_flags}
    -DDISABLE_SPOTIFY

; M-CEEFAX DS-2 resource-contention spike (rnd/ceefax branch only, never merged to
; main). Holds one persistent WSS connection to the live Ceefax relay open for the
; whole session (unconditional, from setup() — worse-case always-on, not gated
; behind any app's resume()/suspend()) while dataTask's normal fetchers run,
; to observe whether a second continuously-open TLS socket reproduces the
; TASK-285/287/289 class of heap/TLS starvation already fought through for
; WebRadio. lib_deps scoped to this env only — WebSockets is not a production
; dependency. Delete this env (and app/src/ceefaxWsSpike.h) when the experiment
; closes out.
;
; Extends production (cyd2usb_winamp), not cyd2usb_winamp_debug: the debug env's
; extra static-BSS load (TOUCH_DEBUG_OVERLAY, CORE_DEBUG_LEVEL=1) plus this
; spike's own WebSockets footprint overflows .dram0.bss even after heap-allocating
; the WebSocketsClient (see ceefaxWsSpike.h). Same fix already used by the other
; PROP-005 spike env on this codebase (cyd2usb_winamp_vistap2): production base +
; -DSERIAL_DEBUG only, so `get`/`set` commands still work without the debug env's
; static-BSS bloat eating the room this experiment needs.
[env:cyd2usb_winamp_debug_ceefaxspike]
extends = env:cyd2usb_winamp
extra_scripts = pre:scripts/inject_git_hash.py
lib_ldf_mode = deep
; deep+ (the project default) fails to resolve WebSockets.h's framework
; <WiFi.h> include for this third-party library specifically (known
; PlatformIO LDF edge case: deep+ builds each library's dependency closure
; in isolation and doesn't inject sibling framework-library include dirs;
; confirmed by testing — explicit WiFi in lib_deps does NOT fix it under
; deep+, only switching to plain `deep` does). Scoped to this env only.
; Plain `deep` mode is less automatic about the main sketch's OWN transitive
; framework needs (unlike deep+), hence the explicit ESPmDNS below — without
; it, main.cpp fails on refreshToken.h's <ESPmDNS.h> include, which deep+
; normally resolves without any help.
build_flags =
    ${env:cyd2usb_winamp.build_flags}
    -DSERIAL_DEBUG
    -DCEEFAX_WS_SPIKE
    -DCORE_DEBUG_LEVEL=0
    ; cyd2usb_winamp (parent) sets CORE_DEBUG_LEVEL=4 (verbose ESP-IDF logging);
    ; overridden to 0 here purely to reclaim a few dozen bytes of .dram0.bss —
    ; this experiment doesn't need IDF-level log verbosity, only the
    ; SERIAL_DEBUG get/set command surface (unaffected by this flag).
lib_deps =
    ${env:cyd2usb_winamp.lib_deps}
    links2004/WebSockets@^2.7.3
    ESPmDNS
