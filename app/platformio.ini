[platformio]
src_dir = src
default_envs = cyd2usb_winamp

[env]
platform = espressif32@6.9.0
board    = esp32dev
framework = arduino
; SpotifyArduino vendored in app/lib/ — LOCAL_PATCHES preserved (see LOCAL_PATCHES.md).
; Upstream headers (spotifyLogic.h, cheapYellowLCD.h, etc.) resolved via lib_extra_dirs.
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    https://github.com/witnessmenow/Seeed_Arduino_NFC.git
; app/lib/ is auto-scanned: SpotifyArduino + SpotifyDiyThingUpstream (vendored upstream headers)
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_ldf_mode = deep+

[common_cyd]
lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI@^2.5.33
build_flags =
    -I.
    ; TASK-471 (M-SRCLAYOUT Stage E): app/lib/SpotifyDiyThingUpstream/spotifyLogic.h
    ; needs app/src headers (logDecode.h, spotifyTask.h, ...) now that it compiles
    ; as its own library .cpp (spotifyLogic.cpp) instead of only ever being
    ; textually pasted into main.cpp.o, which gets src_dir on its include path
    ; for free. Library compilation units do not inherit that automatically.
    -Isrc
    -DYELLOW_DISPLAY
    -DUSER_SETUP_LOADED
    -DILI9341_2_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_BACKLIGHT_OFF=LOW
    -DLOAD_GLCD
    -DSPI_FREQUENCY=40000000
    ; TASK-340: was 20000000. At 20MHz, tft.readRect() MISO reads were
    ; unreliable on this board's wiring/silicon (signal-integrity/timing
    ; fault, not a logic bug) — bit errors on non-flat content produced
    ; readback colours matching no clean channel permutation. DUT-confirmed
    ; via `colorprobe` (main.cpp cmdColorProbe): at 2500000 (matches the
    ; already-proven-safe SPI_TOUCH_FREQUENCY below), a full known-value
    ; sweep read back exactly clean 25/25, matching TFT_eSPI's documented
    ; pushRect()-compat byte swap with zero noise. 1000000 was also clean;
    ; 2500000 kept as the smaller change with margin. See tasks.md TASK-340.
    -DSPI_READ_FREQUENCY=2500000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF
    -DUSE_HSPI_PORT
    -DSPOTIFY_MARKET=\"IE\"
    -DARDUINO_LOOP_STACK_SIZE=20480

[env:cyd2usb_winamp]
; ADR-061 D9 step 4 / TASK-470: [cyd2usb_base] deleted. TASK-467 (D8) had
; already demoted the failing [env:cyd2usb] (JPEGDEC-dependent album-art
; path, no live target) down to this non-building base section, kept alive
; only because this env extended/interpolated it — the indirection existed
; purely to serve the now-fully-retired plain-CYD build (ADR-061 D9
; consequences: "no longer a supported target"). Its three own additions
; (partition table, TFT_INVERSION_ON, CORE_DEBUG_LEVEL default) folded
; straight in here; extends [common_cyd] directly instead of through the
; now-gone middle layer. [common_cyd] itself is untouched — it's still the
; real shared CYD board config (TFT pins, SPI timings, fonts) every env
; here needs, unrelated to cheapYellowLCD.h/CheapYellowDisplay.
extends = common_cyd
board_build.partitions = partitions_no_ota.csv
; lib_ldf_mode = deep (not the project-default deep+). This was originally set
; for WebSockets (removed with the M-CEEFAX/Ceefax cut, ADR-058), and is left
; as `deep` — the validated working mode here — to avoid an LDF-mode change
; during the cut. Plain `deep` is less automatic about the main sketch's OWN
; transitive framework needs, hence the explicit ESPmDNS in lib_deps below
; (refreshToken.h's <ESPmDNS.h>), which deep+ would resolve automatically.
lib_ldf_mode = deep
build_flags =
    ${common_cyd.build_flags}
    -DTFT_INVERSION_ON
    -DCORE_DEBUG_LEVEL=4
    -DWINAMP_DISPLAY
    ; TASK-410: AUDIO_NO_SD_FS dropped — connecttoFS()/File audiofile are back in
    ; the build (measured +88B static DRAM, +3984B flash referenced; M-SDFS §4).
    ; TASK-262 (A-lite PROMOTED 2026-06-29): the WebRadio decoder arena ships in
    ; production. MEMBUDGET_PHASE1 now enables the JIT mb_arena (acquired in
    ; WebRadioApp::_play, released on suspend) + the halved-DMA fork (PATCH-MEMBUDGET-4).
    ; WebRadio-scoped: Spotify has no audio/I2S path, so this changes no Spotify runtime
    ; behaviour. The verbose [membudget] probes are separately SERIAL_DEBUG-gated.
    ; Provisional: Spotify-PLAYING coexistence render unconfirmed (TASK-243 Premium) —
    ; nil risk (no Spotify code changes). Revert via TASK-256 if needed.
    -DMEMBUDGET_PHASE1
lib_deps =
    ${common_cyd.lib_deps}
    ; ESP32-audioI2S v2.3.0 — vendored into app/lib/ESP32-audioI2S/ (TASK-261 Phase 2).
    ; Local lib/ copy is picked up automatically; registry entry removed to avoid conflict.
    ; DO NOT bump to v3.x: allocates ~704 KB at boot → instant crash on no-PSRAM CYD.
    ; See EXP-008 / EXP-009 / BP-042. Fork's arena is enabled via MEMBUDGET_PHASE1 (above).
    ESPmDNS
; TASK-410: SD_MMC no longer lib_ignore'd — Audio.h unconditionally #includes
; <SD_MMC.h> once AUDIO_NO_SD_FS is undefined (it was ignored only because
; that flag made the include dead code). Nothing in this firmware calls into
; it; it exists only so Audio.h resolves at compile time.
lib_ignore = JPEGDEC

[env:cyd2usb_winamp_screenlog]
extends = env:cyd2usb_winamp
build_flags =
    ${env:cyd2usb_winamp.build_flags}
    -DSCREEN_LOG

; TASK-255 (M-WEBRADIO-NOPSRAM): Spotify-disabled experiment variant. -DDISABLE_SPOTIFY
; (presence flag — never =0, LL-006) skips spotifyTask::begin() to free RAM for the
; no-PSRAM WebRadio decoder. Experiment on rnd/webradio-nopsram; not for production.
; Inherits debug instrumentation via extends=...debug so the harness can drive it.
[env:cyd2usb_webradio]
extends = env:cyd2usb_winamp_debug
build_flags =
    ${env:cyd2usb_winamp_debug.build_flags}
    -DDISABLE_SPOTIFY
    -DWEBRADIO_ONLY
    ; OQ1 experiment (rnd/memplan branch only) — COMPLETED, flag removed.
    ; Verdict: static-always 23216 B BSS decoder → maxBlk=37K < 40K TLS → SSL -32512 → wrCount=0.
    ; Decoder must stay runtime-JIT (kind: scratch, placement: runtime). See EXP-011.

; TASK-531 (2026-08-23): cyd2usb_webradio_16k retired. It existed solely to
; run EXP-012 (16K input-ring trial), which closed 2026-07-02 with a negative
; verdict (docs/rnd/reports/EXP-012-input-ring-16k.md: "do not promote; input
; ring stays 8K") — nothing referenced the env afterward. Re-add
; `-DWR_INBUF_16K` extending [env:cyd2usb_webradio] if that experiment is ever
; revisited.

[env:cyd2usb_winamp_debug]
extends      = env:cyd2usb_winamp
extra_scripts = pre:scripts/inject_git_hash.py
build_flags =
    ${env:cyd2usb_winamp.build_flags}
    -DSERIAL_DEBUG
    -DTOUCH_DEBUG_OVERLAY
    -DCORE_DEBUG_LEVEL=1
    ; TASK-427: boot-mount the SD card here too (moved out of the SERIAL_DEBUG gate into
    ; its own flag) — every existing T_PLR/T_SD gate that assumes SD is mounted at boot
    ; keeps working unchanged. Presence-only, never =0 (LL-006).
    -DSD_BOOT_MOUNT
    ; TASK-408 (2026-08-07): raised 0->1 (ESP-IDF error-level only) so log_e() from the
    ; SD/FATFS library is visible. Keep it: `sd_diskio.cpp:800 esp_vfs_fat_register
    ; failed 0x(101)` is the single line that identifies which of the two ESP_ERR_NO_MEM
    ; paths a failed mount took, and it is invisible at level 0. TASK-423's reclaim freed
    ; ~11 KB of headroom the same day, comfortably covering this level's ~144 B cost
    ; against the >=10 KB gate; the TASK-370 comment below explains the drop to 0.
    ; MEMBUDGET_PHASE1 is inherited from cyd2usb_winamp (TASK-262 promotion 2026-06-29).
    ; SERIAL_DEBUG (above) additionally enables the verbose [membudget] heap probes.
    ; TASK-370 (M-CEEFAX/ADR-057): was =1 (ESP-IDF error-level only, already
    ; near-silent) — dropped to 0 to reclaim the ~16 B of .dram0.bss the
    ; DMA-gated Ceefax pump task's std::function/libstdc++ footprint needed
    ; to fit this debug build (region was overflowing by exactly that much).
    ; SERIAL_DEBUG's get/set command surface is unaffected.

; Quiet debug build for local DUT iteration (screendump/UI work) — all apps
; present (Clock, WebRadio, etc.), just no spotifyTask (no token-refresh/TLS/
; poll log chatter competing on Serial with whatever else is being tested).
; Reuses the existing -DDISABLE_SPOTIFY flag (TASK-255/M-WEBRADIO-NOPSRAM) —
; the harness's Dut class already fast-paths readiness via `get variant` for
; this flag, skipping the Spotify-poll wait entirely. Not cyd2usb_webradio:
; that env also sets WEBRADIO_ONLY (an unrelated no-PSRAM memory-budget trim
; tied to a different R&D experiment) — this env is deliberately just
; cyd2usb_winamp_debug minus Spotify, nothing else changed.
[env:cyd2usb_winamp_debug_noSpotify]
extends = env:cyd2usb_winamp_debug
build_flags =
    ${env:cyd2usb_winamp_debug.build_flags}
    -DDISABLE_SPOTIFY

; TASK-422/427 (ADR-059 D10, TASK-431 option a): Player-mode dedicated variant. Local
; MP3 playback needs the Helix arena (24576B contiguous) AND a mounted-SD FATFS context
; (12556B contiguous at max_files=2) at the same time — TASK-425 measured that against
; 30708B of steady-state lfb8 that is a 6424B shortfall whenever the Spotify TLS working
; set is resident, in either acquire ordering. -DDISABLE_SPOTIFY (existing flag, TASK-255/
; M-WEBRADIO-NOPSRAM) removes that working set entirely, so the shortfall does not exist
; here. Mirrors cyd2usb_webradio's structure: extends the debug env (SERIAL_DEBUG +
; SD_BOOT_MOUNT already on there — TASK-427) so the harness can drive it the same way.
; Not in check_build.sh's gate list yet — TASK-422 (DEV-7) adds the 6→7 gate.
[env:cyd2usb_player]
extends = env:cyd2usb_winamp_debug
build_flags =
    ${env:cyd2usb_winamp_debug.build_flags}
    -DDISABLE_SPOTIFY

