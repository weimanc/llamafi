; rig/bare_bod — PROP-011 F-4: the brownout comparator on a minimal firmware, so
; X-P2's load ladder can add one load at a time (rungs = -DBARE_* flags, the arm
; level = -DBARE_BOD_THRES). Driven by app/tools/probe/rig_ladder.py.
; Deliberately OUTSIDE app/: it must not enter run/check's env matrix.
;
; Same platform pin as the product (espressif32@6.9.0 = Arduino-ESP32 2.0.17),
; same partition table, so flashing this rig never moves NVS or SPIFFS (WiFi +
; Spotify credentials live there) and run/flash-debug restores the product cleanly.
; The display rides HSPI exactly as in the product, leaving VSPI to the SD card.

[env:bare]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = ../../app/partitions_no_ota.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOD_WATCH
    -DUSER_SETUP_LOADED -DILI9341_2_DRIVER -DTFT_INVERSION_ON
    -DTFT_WIDTH=240 -DTFT_HEIGHT=320
    -DTFT_MISO=12 -DTFT_MOSI=13 -DTFT_SCLK=14 -DTFT_CS=15 -DTFT_DC=2 -DTFT_RST=-1
    -DTFT_BL=21 -DTFT_BACKLIGHT_ON=HIGH -DTFT_BACKLIGHT_OFF=LOW
    -DLOAD_GLCD -DUSE_HSPI_PORT
    -DSPI_FREQUENCY=40000000 -DSPI_READ_FREQUENCY=2500000 -DSPI_TOUCH_FREQUENCY=2500000
lib_deps =
    bodmer/TFT_eSPI
