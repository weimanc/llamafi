  - id: X037
    feature_a: viewport-repair-001
    feature_b: planeradar-001
    interaction_type: dependency
    description: |
      planeradar-001's TASK-357 follow-up (per-aircraft dirty-rect motion
      redraw — deferred, not yet filed as a task) will call
      withViewportRepair() around _redrawGridStatics() (planeRadarApp.h:756),
      scoping the post-erase static-layer repair (rings/crosshair/runways)
      to each dirty aircraft's bounding box instead of the whole 240px disc
      on every ~10 Hz _motionDirty() tick. viewport-repair-001 has no other
