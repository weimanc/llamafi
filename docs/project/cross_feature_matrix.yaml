  - id: X068
    feature_a: planeradar-001
    feature_b: data-task-001
    interaction_type: conflict
    description: |
      PlaneRadar's debug aircraft injection (`set prInjectAircraft`), landing while a real
      PlaneRadar fetch is in flight, leaves internal heap fragmented. On that fetch's `GET 200`
      the largest free block drops from ~45k to 31k and stays there for the boot. Every TLS
      handshake then fails `-32512 SSL - Memory allocation failed`: PlaneRadar's own, Spotify's,
      and every dataTask fetcher's (Stock, observed). A Stock quote fetch retries every 60 s and
      never succeeds. Same failure class as X010 (TLS OOM at maxAlloc < handshake need), with a
      new trigger. Observed only through the debug injector, but the allocation pattern it
      exposes (a result-processing allocation surviving around a long-lived one) may be reachable
      without it.
    risk: high
    test_coverage: [T_PRI_01, T170]
    notes: |
      Added 2026-09-14 (TASK-697). First written as "Spotify token-refresh failure starves the TLS
      yield"; that reading was wrong and is corrected in
      docs/verification/regression_suite/task697-reboot-inject-stock.md (the yield acked at once;
      the heap lines were in the same logs). Mechanism still a reading: the exact match is two
      failing captures. Next evidence: `get heap` between each T_PRI_01 command.

  - id: X069
    feature_a: serialdbg-001
    feature_b: app-interface-001
    interaction_type: shared_state
    description: |
      TASK-637's identity guard (ADR-063 D3) makes a per-app debug `get` key answer `inactiveApp`
      while its owning app is not the active one, so a test cannot read stale app state and take
      it as current. It couples the console to the shell's active-app state, which some
      consumers read across apps by design: one-way fetch latches (weatherReady, cryptoReady) and
      persisted settings (prPollSec) stay reachable through named exceptions
      (`dbgKeyReachableInactive`, appShell.cpp). The player-slot apps (Spotify, WebRadio,
      LocalPlayer) are unguarded because some of their keys are read from other screens by design
      (TASK-415, ADR-059 D12), and the `set` path is unguarded.
    risk: medium
    test_coverage: [T_WX_04, T_CX_04, T_PRM_01]
    notes: |
      Added 2026-09-14. The first full DUT run of the guard refused exactly those three ids (each
      reads its key without entering the app); the named exceptions fixed them and a probe
      confirmed refusal, exceptions and `get appTicks`. Remaining coverage is TASK-703.
      Side effect: failure diagnostics that read an app's keys after leaving it now get
      `inactiveApp` (T170's `fetchFailed='?'`, TASK-701).
