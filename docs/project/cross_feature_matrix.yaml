  - id: X050
    feature_a: localplay-001
    feature_b: webradio-001
    interaction_type: shared_state
    description: |
      Both modes drive the SAME Audio object. Hardware permits exactly one: one internal DAC
      (GPIO26), one 23216 B Helix arena, one 6400 B InBuff. ADR-059 D2 extracts the singleton,
      its mutex, the wrAudio pump task, mb_arena acquire/release, the audio_process_extern vis
      tap and the volume sink out of webRadioApp.h into audio/audioEngine.h; WebRadio and
      LocalPlayer become peer clients of it. Mode mutual-exclusion (already relied on by
      M-MEMBUDGET) is what makes one engine sufficient — the two modes can never both hold it.
    risk: high
    test_coverage: [T_AE_04]
    notes: |
      The extracted code carries TASK-278/287/289/291/295/299/392/398. Verification obligation
      is a PURE MOVE plus ./run/check 6/6 plus a FULL-LENGTH run/wr-soak — short soaks have
      given false confidence on exactly this code before.
      ---
      TASK-443 (2026-08-15) CHANGES THIS EDGE and the description above is now only half true.
      The two arms still share one Audio object, one mutex and one pump — but under the accepted
      ruling they no longer share the decoder's MEMORY PROVENANCE: WebRadio's URL path keeps the
      arena, the FILE path allocates through mb_arena_alloc()'s libc fallback. "Mode
      mutual-exclusion is what makes one engine sufficient" therefore stops being the whole
      safety argument: the modes are still mutually exclusive at the UI level, but a FILE play
      entered while WebRadio's engine is up decodes out of a LIVE arena, and whichever teardown
      runs first decides whether those buffers outlive it. That is TASK-444 (mb_arena_free()
      routes on the current s_base, which release() nulls — an arena-provenance buffer freed
      after a release calls libc free() on a pointer inside an already-freed block).
      COVERAGE CLAIMED, NOT YET EARNED: T_AE_13/15/16 are specified (test_plan.md, M-AUDIO-ENGINE
      suite) and all three are "planned — cannot run" — 13 and 15 need a working station fetch
      (TASK-438 has it stuck on the current AP), 16 needs the deferred-CONNECTING overlap. Before
      TASK-443 no test in the repo alternated the two arms at all; every driver was URL-only or
      FILE-only, which is why this high-risk edge sat at zero coverage.
      ---
      PLANNED COVERAGE (2026-08-17, P0: only ids with a running body are listed above.) T_AE_01-03 (no id-labelled body; run/wr-soak is the vehicle), T_AE_13/15/16 (blocked).
  - id: X051
    feature_a: localplay-001
    feature_b: memplan-001
    interaction_type: dependency
    description: |
      Dropping -DAUDIO_NO_SD_FS re-enables Audio's `File audiofile` member and the SD/FS code
      paths, adding to .dram0.bss and to heap (FATFS work area + per-file sector cache at
      SD.begin()). The binding build is cyd2usb_winamp_debug, which has sat at 0 B .dram0.bss
      headroom twice this year. Offsetting: local playback opens no TLS, so the ~40 KB mbedtls
      context that forces webradio_decoder + webradio_inbuf to stay placement:runtime is absent
      in this mode — LocalPlayer is the cheapest of the three player modes, not the most costly.
    risk: high
    test_coverage: []
    notes: |
      MEASURED 2026-08-07 (not estimated): debug dram0_0_seg headroom is 304 B (prod 13160 B).
      Enabling SD/FS with the code actually REFERENCED (a probe TU calling SD.begin/openNextFile/
      read/connecttoFS — without it the linker GCs most of the cost and the number flatters) costs
      +16 B .dram0.data, +72 B .dram0.bss = 88 B, leaving 216 B; flash +3984 B. Compile-in only,
      unreferenced, was +40 B / +3904 B.
      Consequence: NO Player state may be static — a LocalPlayerApp global instance puts its members
      in .bss and there is no room. All Player buffers are heap, acquired in resume() and freed in
      suspend() (~7.7 KB + the FATFS work area).
      RECLAIM (ADR-059 D11, operator decision 2026-08-07 — proactive, scheduled FIRST as TASK-423):
      11956 B of the debug build's 12792 B .bss overage over prod (93%) is two function statics in
      one #ifdef SERIAL_DEBUG command — cmdScreenDump's s_b64 (6836 B) and s_band (5120 B),
      app/src/debug/serialConsole/cmdMisc.h (cmdScreenDump). Neither appears in the production map (verified, zero matches). Moving them
      to per-invocation malloc/free takes debug headroom 304 B -> ~12.2 KB with zero production
      impact. No separate X-entry: screendump has no feature id of its own (a small registry gap,
      noted not fixed here), so the edge is recorded against this one.
      Headroom must still be re-derived from a fresh run/build-debug + .map grep at each phase.
      New manifest entries expected: sdfs_fatfs (unmeasured, M-SDFS pass bar <=8 KB) plus
      plmodel_entries/view/play/rowcache/staging and browser_page, all scratch + runtime.
      ---
      TASK-442/443 (2026-08-15) are this dependency failing in production: on cyd2usb_player the
      24 576 B arena acquire takes lfb8 from 26 612 to 2 932 and new (std::nothrow) Audio()
      returns null, so local playback cannot start at all. Bisect (TASK-442) proved the shortfall
      predates the milestone's recent commits — it is not a regression, it is this edge never
      having had the headroom. The accepted ruling removes the arena from this path, which changes
      the dependency's shape: the decoder becomes a nine-allocation consumer (largest 8 708 B)
      instead of a single 24 576 B contiguous one.
      COVERAGE CLAIMED, NOT YET EARNED: T_AE_11/12 (5-track and repeat-all x10, the fragmentation
      curve) can run on the current rig once the ruling lands; T_AE_14 (degrade-not-reset) needs
      `set aeFailDecoder`, firmware that does not exist — so the invariant TASK-432 was filed for
      currently has NO runnable proof.
      ---
      PLANNED COVERAGE (2026-08-17, P0: only ids with a running body are listed above.) T_AE_08, T_AE_11/12/14 (blocked). GATE-COVERED by run/check mem_layout budget gate.
  - id: X052
    feature_a: sdfs-001
    feature_b: localplay-001
    interaction_type: resource_contention
    description: |
      Two tasks touch the filesystem: loopTask (browser paging, playlist row text, save) and the
      audio pump task (Audio::loop() refilling from audiofile). ESP-IDF's FATFS VFS serialises
      per volume, so this is safe but BLOCKING — a bulk directory read on loopTask can stall the
      pump into an audible underrun. Rules: bulk loopTask SD I/O is chunked (<=32 dir entries,
      one row batch per tick); playlist SAVE is the one unbounded operation and pauses playback
      for its duration; the audio engine mutex guards Audio method calls only and must NOT be
      widened to cover the filesystem.
    risk: high
    test_coverage: [T_PLR_09, T_PLR_13]
    notes: |
      The phase-0 latency bar (worst-case single read <=50 ms) is set against the InBuff holding
      ~160 ms of 320 kbps audio. Exit criterion 8: >=30 min local-playback soak WITH concurrent
      browsing and scrolling, not idle playback.
      ---
      PLANNED COVERAGE (2026-08-17, P0: only ids with a running body are listed above.) T_PLR_39 (soak, resv - schedulable now, TASK-442 closed).
      ---
      TASK-521 (2026-08-18, DUT-measured): the failure this interaction actually produces today is
      NOT the blocking/underrun one described above. Browsing while a track plays fails outright,
      and the mechanism is DRAM exhaustion, not FATFS serialisation. During playback on
      cyd2usb_player free8 is 5108 B / largest8 3188 B with the browser's arrays unclaimed, and
      284 B / 140 B once they are claimed; the browser needs 5120 B of arrays plus ~700 B for
      opendir()'s vfs_fat_dir_t. Whichever allocation is asked for last is the one that fails, so
      allocation order is not a lever. Measured NOT to be the cause: open-handle exhaustion
      (sdslots reports 2 of 3 slots free; plCount reports fileOpen:false; FF_FS_LOCK=0 so
      f_opendir cannot return FR_TOO_MANY_OPEN_FILES), FATFS mutex contention (opendir returns in
      247-558 us during playback, never ETIMEDOUT against a 10 s FF_FS_TIMEOUT), and directory
      size (/, /mp3 and /probe200 behave identically). Reclaiming ~6 KB from the playback working
      set is an Architect decision - see M-WINAMP-PLAYER-local-playback.md section 4.1 for the
      candidate levers and their measured headroom.
  - id: X053
    feature_a: sdfs-001
    feature_b: memplan-001
    interaction_type: dependency
    description: |
      SD lives on VSPI (5 CS · 18 SCLK · 19 MISO · 23 MOSI) with its own SPIClass; TFT stays on
      HSPI (USE_HSPI_PORT), touch on its own 25/32/33/36/39. No pin conflict exists — verified
      against the full board allocation at design time. GPIO5 is a strapping pin and must read
      HIGH at reset; SD CS idles high so this is expected benign, but it is a boot-loop class
      failure if a card pulls it low. Mount is lazy on entry to Player mode and released on mode
      exit, mirroring the mb_arena discipline rather than paying the cost at boot.
    risk: medium
    test_coverage: []
    notes: |
