# cross_feature_matrix.yaml
# Owner: Developer
# Updated by: Developer when cross-feature interactions are identified
# Read by: VE (test planning), QM (auditing)

interactions:
  - id: X001
    feature_a: time-001
    feature_b: auth-001
    interaction_type: dependency
    description: |
      TLS validation of Spotify cert chain (accounts.spotify.com, api.spotify.com)
      requires the system clock to be inside the cert's notBefore/notAfter window.
      ESP32 has no RTC, so without time-001's NTP sync at boot, auth-001's first
      refreshAccessToken() call fails at the TLS layer with mbedTLS error 0x0050,
      surfacing as "Status Code -2". time-001 must complete (or time out) before any
      TLS request issued by auth-001.
    risk: high
    test_coverage: [T020]
    notes: Discovered on 2026-04-28 DUT run. Auth retried every 5 s in the existing super-loop, never succeeded with a fresh boot. Fix is configTime() before spotifySetup() in setup().

  - id: X002
    feature_a: api-001
    feature_b: poll-001
    interaction_type: shared_state
    description: Spike harness reads `lastTrackUri` global owned by poll-001 (set in handleCurrentlyPlaying) to scope its audio-features and audio-analysis fetches. Spike has no track-discovery path of its own; if poll-001 hasn't populated the URI yet, the `f`/`a`/`A` commands skip with `[SKIP]`.
    risk: low
    test_coverage: [T016, T017, T018]
    notes: Throwaway coupling; api-001 is deleted once M5 supersedes.

  - id: X003
    feature_a: poll-001
    feature_b: api-002
    interaction_type: shared_state
    description: Both poll-001 (GET /v1/me/player/currently-playing) and api-002 (the planned non-GET fix) operate on the same WiFiClientSecure instance declared in spotifyLogic.h. The bug being fixed by api-002 is precisely that interleaving a non-GET after poll-001's GET (or vice versa) leaves the TLS context in a state mbedTLS rejects on the next send. The fix must preserve poll-001's working GET path while making non-GET work — concrete options are listed in TASK-009.
    risk: high
    test_coverage: []
    notes: Discovered 2026-04-29 in TASK-007 spike run. Until api-002 lands, every PUT/POST in the firmware is broken; only the existing GET poll loop functions.

  - id: X004
    feature_a: playlist-001
    feature_b: api-002
    interaction_type: dependency
    description: playlist-001's getQueue() is a lib patch on SpotifyArduino (LOCAL_PATCHES pattern) that makes a GET request to /me/player/queue using the same WiFiClientSecure connection-lifecycle fix introduced by api-002. If api-002's client->stop() pre-connect discipline is violated or rolled back, getQueue() will exhibit the same 0x0050 mbedTLS failure on non-first-request as the pre-api-002 control endpoints. The queue poll also runs inside spotifyTask on APP_CPU and shares the SpotifyArduino instance with the /me/player poll — both must respect the stop-before-connect contract.
    risk: medium
    test_coverage: []
    notes: Added 2026-05-15 (QM audit). No test specifically validates getQueue() TLS lifecycle in isolation — covered implicitly by the fact that DUT verification (TASK-020) succeeded on the same connection-lifecycle fix. VE to add an explicit test entry.

  - id: X005
    feature_a: playlist-001
    feature_b: m3-001
    interaction_type: shared_state
    description: drawPlaylist() lives inside winampDisplay.h and shares the TFT_eSPI tft instance with the rest of the Winamp chrome renderer (m3-001). Both render paths must respect the tft.startWrite()/endWrite() bracketing introduced by TASK-038 — drawPlaylist() must not call pushImage or fillRect outside a write bracket, and repaintChrome() must not inadvertently overwrite the playlist area (y=116..240) on a full chrome repaint. The two areas are disjoint (chrome at y=0..115, playlist at y=116..240) so the risk is low but the invariant must be maintained as the chrome surface grows.
    risk: low
    test_coverage: []
    notes: Added 2026-05-15 (QM audit). Invariant is structural (origin + height constants keep the areas disjoint); any change to PLEDIT_Y or the chrome height must re-verify non-overlap.

  - id: X006
    feature_a: playlist-002
    feature_b: m2-001
    interaction_type: dependency
    description: playlist-002 extends the bake_skin.py pipeline (m2-001) with build_pledit_atlas() — a new function that opens PLEDIT.BMP from the .wsz, crops and pads title + bottom bar strips, crops the row-highlight sprite, and emits SKIN_PLEDIT_BG + SKIN_PLEDIT_ROW_HIGHLIGHT to gen/skin_assets.c + gen/skin_layout.h. Any change to m2-001's wsz-loading infrastructure, the RGB565 emitter format, or the gen/ file layout affects playlist-002's bake output. golden.sha256 covers both m2-001 and playlist-002 outputs — a bake regression in either shows up in the same determinism check.
    risk: low
    test_coverage: []
    notes: Added 2026-05-15 (QM audit). T025 golden-hash determinism check covers this indirectly. VE to add a positive-content check for SKIN_PLEDIT_BG (analogous to T072 for BALANCE.BMP) if PLEDIT.BMP ever uses BI_RLE8 compression — current PLEDIT.BMP is uncompressed so the manual decoder path does not apply.

  - id: X007
    feature_a: weather-001
    feature_b: crypto-001
    interaction_type: shared_state
    description: |
      Both WeatherApp and CryptoApp share the dataTask FreeRTOS task (dataTask.h /
      dataTaskStorage.cpp). The task owns a single queue (DataRequest enum values
      DATA_FETCH_WEATHER / DATA_FETCH_CRYPTO) and a spinlock-guarded result store for
      each type. If both apps enqueue requests concurrently (e.g. rapid app switching),
      requests are processed serially — dataTask processes one at a time. A stale result
      from a previous enqueue is visible via pollWeather()/pollCrypto() until the new
      result lands. Neither app blocks on the result; both show "---" until valid data
      arrives. Any change to the queue depth, spinlock discipline, or result struct layout
      in dataTask.h affects both consumers.
    risk: low
    test_coverage: [T_X07_01]
    notes: |
      Added 2026-05-25 (QM audit finding 3). ADR-029 covers TLS root CA strategy for
      both endpoints. Interaction is benign under normal single-app use; risk window is
      rapid switching between Weather and Crypto apps before either fetch completes.

  - id: X008
    feature_a: weather-001
    feature_b: app-interface-001
    interaction_type: dependency
    description: |
      WeatherApp relies on App ABC lifecycle (app-interface-001) for correct init/resume/
      suspend/tick/handleInput dispatch. resume() enqueues DATA_FETCH_WEATHER so the
      app refreshes data on every switch-in. suspend() does nothing (stateless WRT
      ongoing fetch — dataTask result is available whenever polled). switchApp() in
      appShell correctly calls suspend() on the outgoing app before calling resume() on
      the incoming app, so no double-enqueue race exists at switch time.
    risk: low
    test_coverage: []
    notes: Added 2026-05-25 (QM audit). Same structural dependency applies to crypto-001; see X009.

  - id: X009
    feature_a: crypto-001
    feature_b: app-interface-001
    interaction_type: dependency
    description: |
      CryptoApp relies on App ABC lifecycle (app-interface-001) for correct init/resume/
      suspend/tick/handleInput dispatch. resume() enqueues DATA_FETCH_CRYPTO. Identical
      structural dependency as weather-001 ↔ app-interface-001 (X008). Any change to
      the resume() call site, the switchApp() sequence, or the dataTask enqueue contract
      affects both weather-001 and crypto-001.
    risk: low
    test_coverage: []
    notes: Added 2026-05-25 (QM audit). Mirror of X008 for the crypto consumer.

  - id: X010
    feature_a: io-001
    feature_b: stock-002
    interaction_type: conflict
    description: |
      The Spotify task (io-001) holds a persistent WiFiClientSecure session
      (~40 k of internal heap) between polls. At steady state this leaves
      maxAlloc ≈ 39 k — below the ~50–70 k a new Yahoo Finance TLS handshake
      requires. Any heatmap auto-refresh (stock-002, 120 s cadence) fails with
      SSL -32512 (Memory allocation failed) unless Spotify's TLS is released
      first.

      Fix (TASK-131 / git c82b4d1): spotifyTask::heatmapPause() stops the
      Spotify client before the fetch and blocks until the task acknowledges
      (binary semaphore, up to 5 s). heatmapResume() releases the task to
      reconnect on its next natural poll. The pause/resume call-site is
      fetchHeatmapQuote() in dataTaskStorage.cpp.

      Invariant: any future dataTask fetch that needs its own TLS session
      while Spotify is live MUST wrap the fetch with heatmapPause() /
      heatmapResume(), or arrange equivalent TLS yield, to avoid this OOM.
    risk: high
    test_coverage: [T216, T217, T219, T220, T221]
    notes: |
      Confirmed on DUT 2026-06-04: 10-min soak post-fix, 5 fetches all 200,
      maxAlloc min=39k (between fetches, with Spotify reconnected), 0 violations.
      heap probe LOG_HEAP macro added to all dataTask fetch functions to surface
      regressions via the serial debug log (dataTask.{weather,crypto,stock} tags).

  - id: X011
    feature_a: settings-001
    feature_b: cfg-001
    interaction_type: shared_state
    description: |
      settingsStorage (/settings.json) and configFile.h (/spotify_diy_config.json) both
      write to SPIFFS. Different file paths — no write conflict at the file level. The
      shared dependency is the SPIFFS mount: if SPIFFS.begin() fails at boot, both
      persistence layers are unavailable. settingsStorage applies per-key defaults on
      missing/corrupt JSON; cfg-001 similarly falls back to defaults. Neither has a
      tested SPIFFS-failure recovery path (both silently use in-memory defaults).
    risk: low
    test_coverage: []
    notes: |
      Added 2026-06-05 (Architect). Low risk on correctly flashed hardware; SPIFFS
      mount failure untested. No recovery beyond reboot. cfg-001 added to
      settings-001.cross_features.

  - id: X012
    feature_a: settings-001
    feature_b: app-interface-001
    interaction_type: dependency
    description: |
      SettingsApp subclasses App (app-interface-001) and is dispatched by the appShell.
      Two specific coupling points:
      (a) g_previousAppId — assigned in switchApp() before any transition to Settings;
      read by SettingsApp::goBack() to return to the prior app. Any change to the
      switchApp() sequence or AppId ordering must preserve this assignment.
      (b) SettingsApp::suspend() resets section=-1, appSubmenu=-1. The shell calls
      suspend() on switch-away; this reset must complete before resume() is called on
      the incoming app, to avoid stale nav state if the user re-enters Settings.
      (c) SettingsSection::handleInput() returns SectionResult::GoBack to signal
      SettingsApp to pop the active section — this internal signal must not be confused
      with the App::handleInput() bool return used by the shell dispatch.
    risk: low
    test_coverage: [T-SET-01, T-SET-02, T-SET-03]
    notes: |
      Added 2026-06-05 (Architect). g_previousAppId fallback is AppId::Spotify; if
      Settings is the first app launched (boot-to-wifi-tab), goBack() correctly falls
      back to Spotify. SectionResult is internal to SettingsApp; the shell never sees it.

  - id: X013
    feature_a: settings-wifi
    feature_b: wifi-001
    interaction_type: conflict
    description: |
      settings-wifi Phase 2 retires wifi-001 entirely: WiFiManager and DoubleResetDetector
      removed from lib_deps, WifiManagerHandler.h retired, boot sequence changed from
      setupWiFiManager() to WiFi.persistent(true) + WiFi.begin() (no-args NVS reconnect).
      During Phase 1, wifi-001 still owns the initial connection; WifiSection is a
      read-only viewer layered on top with no conflict.
      The Phase 2 cutover is a breaking change: any board not yet in NVS (fresh flash,
      no saved credentials) loses the captive-portal first-run path. Mitigation: boot
      falls through to Settings wifi tab if WiFi.begin() fails within 10 s (see
      wifi-settings.md integration prerequisite).
    risk: medium
    test_coverage: []
    notes: |
      Added 2026-06-05 (Architect). check_build.sh must pass post-removal (exit criterion
      C7 in wifi-settings.md). The wifi_creds.h __has_include shim (dev-workaround-001)
      pre-dates WiFiManager and connects before any portal/WifiSection logic — it is
      unaffected by the Phase 2 cutover.

  - id: X014
    feature_a: settings-wifi
    feature_b: io-001
    interaction_type: conflict
    description: |
      WiFi.scanNetworks(true) (async scan in WifiSection::_startScan()) runs on the WiFi
      radio while spotifyTask (io-001) holds a live TLS session. Scan activity can briefly
      disrupt the WiFi station association, causing the Spotify poll to fail mid-request
      with a mbedTLS send error or connection reset. The spotifyTask reconnect logic handles
      transient failures (retry on next poll interval), so the risk is a single missed poll
      rather than a session breakdown — acceptable given the 30 s poll interval.
      Not yet tested on DUT under concurrent scan + active Spotify poll.

      Pattern note: X010 (io-001 ↔ stock-002 TLS OOM) was a similar radio/heap resource
      conflict discovered on DUT after shipping. Flagged proactively here before Phase 1
      DUT validation. If DUT confirms disruption, apply the heatmapPause() pattern:
      pause spotifyTask before scan, resume after WiFi.scanDelete().
    risk: medium
    test_coverage: [T-WIFI-06]
    notes: |
      Added 2026-06-05 (Architect). Scan is user-triggered (not automatic) so the
      conflict window is narrow and low-frequency. Phase 2 auto-connect does not
      add new scans; the single user-initiated scan in _startScan() is the only
      exposure point.

# --- Entry template ---
# - id: X001
#   feature_a: auth-001
#   feature_b: api-001
  - id: X015
    feature_a: dataTask (Core 0 fetch functions)
    feature_b: serialdbg (Core 1 serial handler)
    interaction_type: shared_state
    description: |
      dataTask fetch functions (fetchStockQuote, fetchCrypto, fetchWeather,
      fetchHeatmapQuote) run on Core 0 and publish committed results atomically via
      spinlock-protected result structs. Core 1's serialdbg handler can query app-layer
      state (quoteOkCount, fetchErrorCode, cryptoReady, etc.) but only sees the last
      committed result — not in-progress state. If a fetch hangs mid-execution, all
      Core 1 diagnostics reflect default/stale values with no indication of where the
      hang occurred.

      M-DATATASK-PROGRESS addresses this gap by adding volatile int8_t progress atoms
      updated per-step in each fetch function. These are readable from Core 1 at any
      time without a lock (single-byte write, ESP32 byte writes are atomic). The pattern
      is applicable to any multi-step Core 0 function that can take >5 s and has
      distinct observable phases.

      Confirmed pain point: T170 / T188 fail in full-suite runs with fetchFailed=False,
      fetchErrorCode=None — indicating fetchStockQuote() never completed, not that it
      failed. Without a progress indicator, the hung ticker (0–7) is invisible to tests.

      Open question (see M-DATATASK-PROGRESS §Open question): which other fetch functions
      benefit from phase-level progress indicators? Candidates include fetchWeather
      (TLS/GET/parse phases), fetchCrypto (TLS/GET/parse), fetchHeatmapQuote (TLS/stream).
    risk: medium
    test_coverage: [T170, T188]
    notes: |
      Diagnosed 2026-06-12 during T170/T188 root-cause investigation. Added fetchErrorCode
      diagnostic to T170/T188 failure path (commit pending); result was fetchFailed=False,
      fetchErrorCode=None — confirming hang rather than error. Design in
      docs/architecture/designs/M-DATATASK-PROGRESS.md.

  - id: X016
    feature_a: teletext-001
    feature_b: touch-004
    interaction_type: dependency
    description: |
      TeletextApp::hasPendingAsync() returns `_pendingFetch`, which is true from the
      moment a page fetch is enqueued (via _navigate(), _goBack(), or tick() periodic
      poll) until pollTeletext() returns a result. Shell polls hasPendingAsync() after
      every touch event and every tick(); while true, setBusy(true) fires, painting the
      taskbar active-slot indicator amber and blocking further touch input via the
      g_shellBusy gate in appHandleInput().

      Critical: _navigate() and _goBack() direct-enqueue via dataTask::enqueueTeletextPage()
      AND set _pendingFetch = true. tick() guards its own enqueue path with !_pendingFetch,
      so these two paths are mutually exclusive — exactly one fetch is in flight at any time.
      After poll success tick() sets _pendingFetch = false, shell clears busy to green.
    risk: low
    test_coverage: [T-BUSY-01, T-BUSY-02, T-BUSY-03]
    notes: |
      Wired 2026-06-14. Before this, TeletextApp did not override hasPendingAsync()
      (default false), so the busy indicator never fired for teletext navigation.
      _navigate()/_goBack() also previously set _pendingFetch = false immediately after
      direct-enqueueing, which would have caused a double-enqueue on the next tick().

  - id: X017
    feature_a: app-error-signal-001
    feature_b: touch-004
    interaction_type: conflict
    description: |
      Active-slot indicator precedence when an app is simultaneously errored AND busy.
      taskbar.h:renderActiveIndicator currently picks busy(amber) vs idle(green). ADR-046
      adds error(red) with precedence error > busy > idle: hasError() red wins even while
      g_shellBusy is true. The shell must evaluate hasError() before the busy branch on every
      indicator re-render (setShellBusy / app switch / tick poll). NB busy is shell-global
      (g_shellBusy) while hasError() is per-active-app; both colour the same 3px bar.
    risk: medium
    test_coverage: [T-ERR-03]
    notes: Added 2026-06-25 (ADR-046). Precedence/colour is visual — T-ERR-03 is manual (no pixel readback). TASK-245.

  - id: X018
    feature_a: app-error-signal-001
    feature_b: app-registry-001
    interaction_type: overlap
    description: |
      Accepted limitation (ADR-046 §4): the bar recolours the ACTIVE app's slot only, so an
      app's red is visible only while it is the active app. With taskbar scroll + multi-app
      registry, an errored non-active app (e.g. Spotify 403 while the user is in Stock) shows
      NO red on its slot. There is no persistent per-slot health dot — deliberately rejected
      in ADR-046 for cost. renderActiveIndicator returns after the active slot; non-active
      slots render icon-only regardless of their hasError().
    risk: low
    test_coverage: [T-ERR-02]
    notes: |
      Added 2026-06-25 (ADR-046). Document the limitation as expected behaviour, not a defect.
      Emergent upside: each app shows its OWN red when active and its own op hard-fails.
      T-ERR-02 step 2 asserts active:false on Clock while spotifyAuthError stays true. TASK-245.

  - id: X019
    feature_a: app-error-signal-001
    feature_b: app-registry-001
    interaction_type: shared_state
    description: |
      Error state must survive app-switch away and back. hasError() is owned by the app
      instance (sticky member state), not the shell, so switchApp() away → back re-reads the
      same latched condition; switchApp() must call renderActiveIndicator with the current
      hasError() so the red is repainted on return (it is not a one-shot on error onset).
    risk: low
    test_coverage: [T-ERR-02]
    notes: Added 2026-06-25 (ADR-046). T-ERR-02 step 3 asserts active:true again after switch away/back. TASK-245.

  - id: X020
    feature_a: app-error-signal-001
    feature_b: poll-001
    interaction_type: dependency
    description: |
      SpotifyApp::hasError() (first consumer) derives from the poll-001 HTTP status —
      lastHttpRef() / status at spotifyTaskStorage.cpp:193-195 (the 403). Clear-on-recovery:
      the red must drop back to green/amber on the next 200/204 poll. Sticky-set on persistent
      403; cleared when poll-001 reports success. Same 403 signal hardened by TASK-244.
    risk: medium
    test_coverage: [T-ERR-01, T-ERR-04, T-ERR-05]
    notes: |
      Added 2026-06-25 (ADR-046). authError() is a sticky 403 latch (set on 403, cleared on
      200/204; touch-immune, no flap — ADR-046 amendment 2). T-ERR-01 asserts 403→true / 200→clear;
      T-ERR-04 connecting (boot amber) → green on first success; T-ERR-05 latch survives backoff
      reset (touch). Status code only — the "no Premium" reason body is discarded by the vendored
      lib (ADR-046 rejected option). TASK-245.

  - id: X021
    feature_a: app-error-signal-001
    feature_b: data-task-001
    interaction_type: dependency
    description: |
      The amber "connecting" state generalises to every NETWORK taskbar app, not just Spotify.
      Weather, Crypto, Stock and Teletext all fetch via the shared dataTask; each wires
      App::isConnecting() to its own first-data signal — Weather/Crypto: s_wxDataReady /
      s_cxDataReady; Stock: _everHadData (set on first successful quote/chart/heatmap); Teletext:
      _st.ready. Amber on entry → green when the first result lands (red on error is TASK-246).
      Offline apps (Clock/Matrix/Life/Aquarium/Settings) keep the default isConnecting()==false.
      Attribution is per-app via the App abstraction (the shell reads only the active app), NOT a
      global dataTask flag — the dataTask cannot name AppId (it is included BY appShell.h, so a
      global hook would be a layering inversion) and an "in-flight" flag would miss the queued/
      starved window (TASK-244) and flash amber on every periodic refresh.
    risk: low
    test_coverage: [T-ERR-06, T-ERR-07]
    notes: |
      Added 2026-06-25 (TASK-245, extending ADR-046's connecting state to network apps). DUT-verified:
      Weather/Crypto/Stock/Teletext report connecting:true on entry, →false once data arrives.
      The connecting state initially surfaced the TASK-244 starvation as "stuck on amber" (Spotify
      403 hammering every 5–20 s monopolised the shared tlsYield); TASK-244 (nextWaitMs hard-backoff
      to 60 s on the 403 latch) fixed it — teletext now amber→green in ~2 s on DUT. T-ERR-06
      automates the offline-default invariant (Clock/Matrix connecting:false).

  - id: X022
    feature_a: player-state-001
    feature_b: taskbar-001
    interaction_type: shared_state
    description: |
      player-state-001 redirects a taskbar tap on the player slot through resolvePlayerSlot():
      taskbar-001's gesture-end maps a tap to an AppId and calls switchApp(); player-state-001
      intercepts the result so AppId::Spotify resolves to the last-active player mode (Spotify or
      WebRadio). Relies on taskbar-001's invariant that WebRadio is excluded from the taskbar
      (eject-only — TASK-242/LL-085), so a taskbar tap can only ever surface AppId::Spotify; if
      WebRadio were ever added to the taskbar this redirect would double-count and the eject-only
      invariant would break. switchApp() also tracks the mode (writes g_settings.playerMode when the
      player enters either mode), so the two are coupled at both the read (resolve) and write (track)
      sides.
    risk: medium
    test_coverage: []
    notes: |
      PART 1 implemented TASK-259 (a825521). Both wired at the two taskbar gesture-end sites
      (touch + serial-driven). DUT-VERIFIED 2026-06-27 (13f701d): eject→other app→player slot returns to WebRadio PASS.

  - id: X023
    feature_a: player-state-001
    feature_b: settings-001
    interaction_type: dependency
    description: |
      PART 2 persists the player mode in settings-001's SPIFFS store (g_settings.playerMode, new
      top-level "player" object in settings.json) and adds a Settings → Applications → Player
      toggle. Depends on settings-001's load/save mapping and the configurable-apps codegen path
      (appRegistry.h cfg flag → gen_app_registry.py → gen/configurable_apps.h, consumed by
      appsSection.h). Flipping Spotify cfg 0→1 makes the player appear in the Applications list;
      the generated file MUST be regenerated + committed or run/check [5/5] codegen-staleness fails.
      Save policy: immediate saveSettings() on eject/toggle with unchanged-value skip (flash-wear).
    risk: medium
    test_coverage: []
    notes: |
      PART 2 designed (M-PLAYER-STATE §3/§4/§5), not yet implemented. Settings round-trip is
      offline-verifiable (run/spiffs pull settings.json → inspect player.mode). OQ-LABEL: show
      "Spotify" vs add a "Player" display-name codegen column.

  - id: X024
    feature_a: player-state-001
    feature_b: webradio-001
    interaction_type: shared_state
    description: |
      Eject is the mode toggle: the Spotify handler ejects to WebRadio and webRadioApp.h:309 ejects
      back to Spotify. PART 2 makes each eject write g_settings.playerMode (+ persist), so the
      toggle source-of-truth is the settings field, not a separate runtime global. Boot composes
      with the existing webRadioAutoplay knob (reconnect-last-station-on-resume): v1 cold-boots to
      the Spotify view regardless of persisted mode, so webRadioAutoplay (not playerMode) governs
      whether radio actually auto-starts. Boot-into-persisted-mode (v2, M-PLAYER-STATE OQ-BOOT) is
      where the two would directly interact and is deferred.
    risk: low
    test_coverage: []
    notes: |
      The eject-toggle behaviour lives in webRadioApp.h:309 (WebRadio->Spotify) + the Spotify
      handler (Spotify->WebRadio), now covered by webradio-001 (backfilled 2026-06-27). v2
      boot-into-mode couples with M-MEMBUDGET (the Option-A-lite boot-direct-to-WebRadio appliance).

  - id: X025
    feature_a: pr-locations-001
    feature_b: settings-001
    interaction_type: dependency
    description: |
      PrLocation[4] slots + prActiveLoc live inside settings-001's AppSettings /
      settings.json store, with a load-time migration (pre-upgrade file without "locs"
      seeds slot 0 "HOME" from the stored prLat/prLon — settingsStorage.cpp:292-299,
      ordering-sensitive: the migration branch MUST run after the lat/lon parse or a
      real pre-upgrade location is silently replaced by the compile default, see
      DEV-PRL-6 comment) and load-time invariants (slot 0 never empty; prActiveLoc
      always points at a defined slot; prLat/prLon re-derived from the active slot on
      EVERY load — settingsStorage.cpp:305-318). Any future change to load() ordering
      or the settings schema must preserve all three.
    risk: medium
    test_coverage: [T_PRL_04, T_PRL_07]
    notes: |
      Added 2026-07-16 (Architect registration pass — M-PR-LOCATIONS shipped TASK-315..325
      without matrix entries). Design: M-PR-LOCATIONS-location-presets.md "Settings storage".

  - id: X026
    feature_a: pr-locations-001
    feature_b: planeradar-001
    interaction_type: shared_state
    description: |
      prLat/prLon are the write-through MIRROR of prLocs[prActiveLoc] — every radar
      consumer (projection math, fetch centre, runway overlay) reads only the mirror.
      Every writer of prLocs/prActiveLoc must refresh the mirror in the same change:
      writers today are settingsStorage::load() (X025), _setActiveLoc() (strip tap +
      `set prloc active`, the DEV-3/QM-1 single switch primitive), _prSaveCoords() /
      _prDeleteSlot() (appsSection.h:808/:632 — H-11 name/line fix: was cited as
      _prSaveGeocode), and `set prloc <i> <label> <lat> <lon>` (main.cpp serialdbg).
      KNOWN NON-COMPLIANT (H-3, found 2026-07-16 review): the full-form serial
      writer at main.cpp:3422-3426 refreshes NO mirror today — editing the active
      slot's coords over serial leaves the radar stale until reboot/switch. Fix
      owned by M-HOME-LOCATION's shared writer helper (T-HOME-06). A new writer
      that skips the mirror leaves the radar centred on stale coordinates with no
      error. _setActiveLoc() additionally owns the
      result-state reset (count/age/stale cleared, ADR-046 amber connecting fires) —
      an inline copy of the switch sequence elsewhere is the BP-047/LL-110 duplication
      shape and is forbidden.
    risk: medium
    test_coverage: [T_PRL_02, T_PRL_05, T_PRL_10]
    notes: |
      Added 2026-07-16 (Architect registration pass). Design: M-PR-LOCATIONS
      "Radar app — strip becomes the location switcher".

  - id: X027
    feature_a: pr-locations-001
    feature_b: data-task-001
    interaction_type: shared_state
    description: |
      Two result-identity contracts guard cross-task staleness: (a) geocode requests
      carry a monotonic seq echoed in GeocodeResult — the editor stores the seq it
      enqueued and ignores+discards any polled result with a different seq (covers
      cancel/back-out/retry mid-flight, VE-PRL-5, TASK-300 lineage); (b) a location
      switch bumps an epoch byte echoed in PlaneRadarResult — the app's poll discards
      results whose epoch predates the current one, else old-location aircraft render
      on the new-location grid for up to one fetch cycle (VE-PRL-6, TASK-308/309
      lineage). Request payloads travel via the pending-config-mux snapshot pattern
      (NOT the 7-char stock Request.symbol queue — UK postcodes don't fit). Any new
      dataTask consumer added to this app must adopt the same identity rule.
    risk: medium
    test_coverage: [T_PRL_08, T_PRL_09]
    notes: |
      Added 2026-07-16 (Architect registration pass). Design: M-PR-LOCATIONS
      "Geocode fetch — dataTask one-shot".

  - id: X028
    feature_a: pr-locations-001
    feature_b: poll-001
    interaction_type: conflict
    description: |
      The geocode fetch is a TLS one-shot on the dataTask while the Spotify task may
      hold or want its own TLS session — same heap-contention surface as the
      TASK-287/289 tlsYield lineage. The fetcher must tlsYield() before handshake
      (BP-031) and coexist with Spotify-active without SSL -32512 either way.
    risk: medium
    test_coverage: [T_PRL_11]
    notes: |
      Added 2026-07-16 (Architect registration pass). T_PRL_11 passed the TASK-324 gate
      2026-07-16.

  - id: X029
    feature_a: pr-locations-001
    feature_b: settings-001 (KeyboardWidget)
    interaction_type: dependency
    description: |
      The slot editor's keyboard steps (EditLabel / LookupCountry / LookupPostcode)
      hand the FULL canvas to the global KeyboardWidget. Two ordering invariants in
      appsSection.h: (a) handleInput checks g_keyboard.active() BEFORE the header
      back-tap test, because the keyboard's cancel zone (x<40, y<KB_INPUT_H) overlaps
      where the section's back zone would be (appsSection.h:73-80, mirrors
      wifiSection's guard) — reordering silently swallows keyboard cancels; (b)
      repaint() early-returns during keyboard steps so section chrome never paints
      over the keyboard (appsSection.h:32-33). Agent-driven testing of the whole
      editor rides on TASK-325's kbText/kbOk/kbCancel serialdbg injection.
    risk: low
    test_coverage: [T_PRL_01a, T_PRL_01b]
    notes: |
      Added 2026-07-16 (Architect registration pass). Third consumer of this pattern
      (wifiSection, stock-ticker editor, prloc editor) — candidate for extraction if a
      fourth appears.

  - id: X030
    feature_a: pr-locations-001
    feature_b: settings-001
    interaction_type: overlap
    description: |
      The device now has THREE independent user-facing location stores in one
      settings.json: Time & Location city lat/lon (timeSection city picker),
      PlaneRadar prLocs[4] (geocode/manual entry), and webRadioCountry. They share no
      code and can freely disagree. M-PR-LOCATIONS explicitly deferred a shared
      "device home location" (design Context: "nothing here should preclude slot 0
      later being aliased as the device home, but we don't design that now");
      M-SETTINGS-WIRE2 G4 raises the stakes by making Weather consume the city
      lat/lon — after it lands, a user who sets city=Tokyo but prLocs HOME=Amsterdam
      gets Tokyo weather and Amsterdam radar with no UI hint of the divergence.
      Register so the unification question (M-SETTINGS-WIRE2 OQ1) stays visible
      rather than re-derived by a future audit.
    risk: low
    test_coverage: []
    notes: |
      Added 2026-07-16 (Architect registration pass). No defect today — this is a
      designed-in overlap awaiting a "device home location" decision. Any design that
      adds a FOURTH location store must go through Architect.
      2026-07-16 (later): resolution DRAFTED — M-HOME-LOCATION (home = prLocs[0],
      Time&Location lat/lon become its mirror; webRadioCountry stays independent).
      X035 reserved for the unified edges; this entry closes when that design lands.
      2026-07-17: CLOSED — M-HOME-LOCATION landed (dcc12bf); the coordinate stores
      are unified under X035's contract. webRadioCountry remains independent by
      design (content preference). The residual divergence surface is cosmetic
      (city label vs refined coords — design OQ3, human-accepted v1).

  - id: X031
    feature_a: settings-001
    feature_b: time-001
    interaction_type: dependency
    description: |
      The persisted timezone (g_settings.posixTz) must be applied at boot by time-001's
      NTP-init path, not only by the Settings city picker. Today boot calls
      configTime(0, 0, ...) = UTC (main.cpp:2265) and the saved rule is applied solely
      inside timeSection's city pick (configTzTime, timeSection.h:241) — so every
      reboot silently reverts all clocks to UTC (M-SETTINGS-WIRE2 G1). Fix couples the
      two: boot ordering guarantee is SettingsStorage::load() (main.cpp:2119) BEFORE
      configTzTime(g_settings.posixTz, ...); the city picker remains the change-time
      applier. Same edge-shape as X001 (time-001 must precede TLS): boot-order
      dependencies around time-001 keep biting.
    risk: medium
    test_coverage: []
    notes: |
      Reserved 2026-07-16 at design time by M-SETTINGS-WIRE2 §4-G1 (Architect registry
      remit). IMPLEMENTED 2026-07-17 (a241b44): boot now configTzTime(g_settings.posixTz).
      VE attaches T-SETW-10 at suite landing.

  - id: X032
    feature_a: settings-001
    feature_b: weather-001
    interaction_type: dependency
    description: |
      Weather fetch coordinates come from the Time & Location city (g_settings.lat/lon)
      instead of the compile-time WEATHER_URL constant (dataTaskStorage.cpp:121, which
      pins every device to one hardcoded location — M-SETTINGS-WIRE2 G4). Contract:
      snapshot-at-enqueue via enqueueWeather(lat, lon) (enqueuePlaneRadar pattern —
      never a cross-core read of g_settings floats at fetch time); WeatherApp resume()
      diffs a coord snapshot and forces a refetch on mismatch (StockApp ticker-diff
      pattern); empty-city sentinel (city[0]=='\0', NOT lat==lon==0.0 — 0,0 is a real
      place) falls back to WX_DEFAULT_LAT/LON preserving today's behaviour.
    risk: medium
    test_coverage: []
    notes: |
      Reserved 2026-07-16 at design time by M-SETTINGS-WIRE2 §4-G4 (Architect registry
      remit). IMPLEMENTED 2026-07-17 (1abfb32): enqueueWeather(lat,lon) snapshot +
      pendingMask coalescing kept (W-5) + resume-diff + URL LOG_D; weather_doc placed
      in the overlay per the TASK-326 ruling. The empty-city sentinel/WX_DEFAULT
      fallback was NEVER built — superseded by X035 (home always defined) per the
      W-3 coordination note; lat/lon are the HOME mirror since dcc12bf. VE attaches
      T-SETW-13 at suite landing.

  - id: X033
    feature_a: settings-001
    feature_b: disp-001
    interaction_type: dependency
    description: |
      Auto-brightness (dispAuto/ldrLow/ldrHigh) needs an owner outside the Settings UI:
      today the whole LDR sample→map→ledcWrite loop lives in DisplaySection::tick()
      (displaySection.h:24-42) and runs ONLY while Settings→Display is the active view;
      boot applies manual dispLevel unconditionally (main.cpp:2127) even when
      dispAuto=true (M-SETTINGS-WIRE2 G5). Fix introduces a global BacklightFlow
      (LedFlow clone: applyMode() at boot, tick() in main loop, pause()/resume() so the
      Display section's manual-slider preview doesn't fight the controller). Invariant
      after the fix: DisplaySection is a pure editor — it never writes the backlight
      duty directly, only through g_backlight.
    risk: medium
    test_coverage: []
    notes: |
      Reserved 2026-07-16 at design time by M-SETTINGS-WIRE2 §4-G5 (Architect registry
      remit). IMPLEMENTED 2026-07-17 (49297a3): BacklightFlow global owner (boot
      applyMode honours dispAuto; ticks in every app); DisplaySection demoted to
      editor (pause/applyManual/resume handshake); LedFlow relocated to
      app/src/ledFlow.h (W-4); injectLdr + get duty hooks landed. VE attaches
      T-SETW-14/15 at suite landing.

  - id: X034
    feature_a: settings-webradio
    feature_b: webradio-001
    interaction_type: dependency
    description: |
      On-device WebRadio settings UI (M-WEBRADIO-SETTINGS) couples to the radio app
      through the D3 resume-diff contract (r2, post-review): webRadioApp snapshots
      country+bitrateCap at each station-list fetch; resume() diffs against g_settings
      and on mismatch resets _currentIdx, clears the list, aborts any in-flight fetch
      (abortWebRadioFetch), and re-enqueues via the TASK-289 second-chance path.
      RESULT IDENTITY is mandatory (WR-1 blocker): WebRadioStationsResult carries
      country+cap echoes and the install site discards mismatches — without it a
      stale parked/in-flight old-country result repopulates the list AFTER the diff
      (TASK-300 pattern). webRadioLastStation resets to 0 AT EDIT TIME in the
      section's country/cap commit (rides its saveSettings(); closes the WR-2 reboot
      window — a resume()-time RAM reset persists new-country + old-index to flash).
      The persisted value is an INDEX into the fetched list — either edit voids
      station identity. Autoplay must NOT fire across a config change.
      A no-edit Settings round-trip must NOT refetch (TASK-284 rate-limit
      sensitivity). Volume: the UI slider stores webRadioMaxVolume 1..21 but
      wrEffectiveVolume() (TASK-209) remains the single clamp authority — hwMod stays
      serial/spiffs-only. No taskbar edge: the cfg column feeds only
      Settings->Applications; X022's eject-only invariant is unaffected.
    risk: medium
    test_coverage: [T-WRSET-01, T-WRSET-02, T-WRSET-03, T-WRSET-04, T-WRSET-05,
                    T-WRSET-06]
    notes: |
      Reserved 2026-07-16 at design time by M-WEBRADIO-SETTINGS §5 (Architect registry
      remit). IMPLEMENTED 2026-07-17 (fff0208): country+cap result echoes + install-
      site discard, edit-time lastStation resets, resume-diff + abort, coalesced
      suspend save, phase-forwarded volume slider, cfg=1 registry flip, default cap
      128. Suite fully PASS on DUT 2026-07-17 (01/04 via the 16b8acc debug hooks,
      05 re-run via dataq wrEnqueues). WR-4 coordinate re-derivation across settings
      suites — DONE 2026-07-17 (later session, VE/DUT real-data pass): only
      app-settings-wire-001.md needed the fix (m-clock-styles.md and
      m-pr-locations-dut.md carry no hardcoded Applications-list taps); see
      test_plan.md's WR-4 entry and app-settings-wire-001.md's updated layout table.

  - id: X035
    feature_a: home-location-001
    feature_b: pr-locations-001
    interaction_type: shared_state
    description: |
      Device home = prLocs[0] (M-HOME-LOCATION D1b): the Time & Location lat/lon
      fields become a load-derived write-through mirror of slot 0, consumed by
      weather (WIRE2 G4). TWO mirrors exist after this design (H-1 r2): the ACTIVE
      mirror prLat/prLon (X026) and the HOME mirror lat/lon — writers refresh BOTH
      where applicable per the design's writer×mirror matrix (D2), routed through
      one shared helper. Obligations: (a) the city picker becomes a prLocs[0]
      WRITER — home mirror always, active mirror iff prActiveLoc==0 (the default
      case — skipping it leaves the radar silently stale); (b) the HOME-slot
      editor refines coords only — tz and city name stay city-picker-owned; slot-0
      edits refresh the home mirror UNCONDITIONALLY even when slot 0 is not active
      (H-2); (c) radar active-slot switching (prActiveLoc) must NEVER move home —
      weather is pinned to slot 0, not the active slot; (d) the D4 migration (seed
      slot 0 from city iff slot 0 is still the untouched compile default, epsilon +
      kCities-membership guarded) runs AFTER X025's prLocs load invariants.
      Supersedes X032's empty-city fallback story: slot 0 is always defined, so
      weather always has coordinates.
    risk: medium
    test_coverage: [T-HOME-01, T-HOME-02, T-HOME-03, T-HOME-04, T-HOME-05, T-HOME-06]
    notes: |
      Reserved 2026-07-16 at design time by M-HOME-LOCATION §5 (Architect registry
      remit). IMPLEMENTED 2026-07-17 (dcc12bf): prSlotWritten() shared helper is the
      single writer x mirror site (fixes the X026/H-3 serial-writer no-mirror bug);
      dual mirror derivation at load; D4 migration kCities+epsilon guarded;
      PR_DEFAULT_LAT/LON constant unifies the literal sites; >500km hint + divKm +
      get prloc home observables. Suite fully dispositioned 2026-07-17 (later,
      real-data DUT session, snapshot-guarded, human-authorized): T-HOME-01/03/06
      PASS (earlier session); T-HOME-02/05 PASS and T-HOME-04 RUN+PASS (this
      session) — see test_plan.md per-test entries. All six T-HOME tests closed.
      Residual noted by implementer (manual-entry confirm path, TASK-322, shows no
      divergence hint — Lookup path only) **dispositioned in T-HOME-05 (2026-07-17)**:
      accepted as-is for v1, a deliberately-scoped limitation per the design's own
      "no Retry concept for manual entry" comment, not a defect. No follow-up filed.

