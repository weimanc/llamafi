# cross_feature_matrix.yaml
# Owner: Developer
# Updated by: Developer when cross-feature interactions are identified
# Read by: VE (test planning), QM (auditing)

interactions:
  - id: X001
    feature_a: time-001
    feature_b: auth-001
    interaction_type: dependency
    description: |
      TLS validation of Spotify cert chain (accounts.spotify.com, api.spotify.com)
      requires the system clock to be inside the cert's notBefore/notAfter window.
      ESP32 has no RTC, so without time-001's NTP sync at boot, auth-001's first
      refreshAccessToken() call fails at the TLS layer with mbedTLS error 0x0050,
      surfacing as "Status Code -2". time-001 must complete (or time out) before any
      TLS request issued by auth-001.
    risk: high
    test_coverage: [T020]
    notes: Discovered on 2026-04-28 DUT run. Auth retried every 5 s in the existing super-loop, never succeeded with a fresh boot. Fix is configTime() before spotifySetup() in setup().

  - id: X002
    feature_a: api-001
    feature_b: poll-001
    interaction_type: shared_state
    description: Spike harness reads `lastTrackUri` global owned by poll-001 (set in handleCurrentlyPlaying) to scope its audio-features and audio-analysis fetches. Spike has no track-discovery path of its own; if poll-001 hasn't populated the URI yet, the `f`/`a`/`A` commands skip with `[SKIP]`.
    risk: low
    test_coverage: [T016, T017, T018]
    notes: Throwaway coupling; api-001 is deleted once M5 supersedes.

  - id: X003
    feature_a: poll-001
    feature_b: api-002
    interaction_type: shared_state
    description: Both poll-001 (GET /v1/me/player/currently-playing) and api-002 (the planned non-GET fix) operate on the same WiFiClientSecure instance declared in spotifyLogic.h. The bug being fixed by api-002 is precisely that interleaving a non-GET after poll-001's GET (or vice versa) leaves the TLS context in a state mbedTLS rejects on the next send. The fix must preserve poll-001's working GET path while making non-GET work — concrete options are listed in TASK-009.
    risk: high
    test_coverage: []
    notes: Discovered 2026-04-29 in TASK-007 spike run. Until api-002 lands, every PUT/POST in the firmware is broken; only the existing GET poll loop functions.

  - id: X004
    feature_a: playlist-001
    feature_b: api-002
    interaction_type: dependency
    description: playlist-001's getQueue() is a lib patch on SpotifyArduino (LOCAL_PATCHES pattern) that makes a GET request to /me/player/queue using the same WiFiClientSecure connection-lifecycle fix introduced by api-002. If api-002's client->stop() pre-connect discipline is violated or rolled back, getQueue() will exhibit the same 0x0050 mbedTLS failure on non-first-request as the pre-api-002 control endpoints. The queue poll also runs inside spotifyTask on APP_CPU and shares the SpotifyArduino instance with the /me/player poll — both must respect the stop-before-connect contract.
    risk: medium
    test_coverage: []
    notes: Added 2026-05-15 (QM audit). No test specifically validates getQueue() TLS lifecycle in isolation — covered implicitly by the fact that DUT verification (TASK-020) succeeded on the same connection-lifecycle fix. VE to add an explicit test entry.

  - id: X005
    feature_a: playlist-001
    feature_b: m3-001
    interaction_type: shared_state
    description: drawPlaylist() lives inside winampDisplay.h and shares the TFT_eSPI tft instance with the rest of the Winamp chrome renderer (m3-001). Both render paths must respect the tft.startWrite()/endWrite() bracketing introduced by TASK-038 — drawPlaylist() must not call pushImage or fillRect outside a write bracket, and repaintChrome() must not inadvertently overwrite the playlist area (y=116..240) on a full chrome repaint. The two areas are disjoint (chrome at y=0..115, playlist at y=116..240) so the risk is low but the invariant must be maintained as the chrome surface grows.
    risk: low
    test_coverage: []
    notes: Added 2026-05-15 (QM audit). Invariant is structural (origin + height constants keep the areas disjoint); any change to PLEDIT_Y or the chrome height must re-verify non-overlap.

  - id: X006
    feature_a: playlist-002
    feature_b: m2-001
    interaction_type: dependency
    description: playlist-002 extends the bake_skin.py pipeline (m2-001) with build_pledit_atlas() — a new function that opens PLEDIT.BMP from the .wsz, crops and pads title + bottom bar strips, crops the row-highlight sprite, and emits SKIN_PLEDIT_BG + SKIN_PLEDIT_ROW_HIGHLIGHT to gen/skin_assets.c + gen/skin_layout.h. Any change to m2-001's wsz-loading infrastructure, the RGB565 emitter format, or the gen/ file layout affects playlist-002's bake output. golden.sha256 covers both m2-001 and playlist-002 outputs — a bake regression in either shows up in the same determinism check.
    risk: low
    test_coverage: []
    notes: Added 2026-05-15 (QM audit). T025 golden-hash determinism check covers this indirectly. VE to add a positive-content check for SKIN_PLEDIT_BG (analogous to T072 for BALANCE.BMP) if PLEDIT.BMP ever uses BI_RLE8 compression — current PLEDIT.BMP is uncompressed so the manual decoder path does not apply.

  - id: X007
    feature_a: weather-001
    feature_b: crypto-001
    interaction_type: shared_state
    description: |
      Both WeatherApp and CryptoApp share the dataTask FreeRTOS task (dataTask.h /
      dataTaskStorage.cpp). The task owns a single queue (DataRequest enum values
      DATA_FETCH_WEATHER / DATA_FETCH_CRYPTO) and a spinlock-guarded result store for
      each type. If both apps enqueue requests concurrently (e.g. rapid app switching),
      requests are processed serially — dataTask processes one at a time. A stale result
      from a previous enqueue is visible via pollWeather()/pollCrypto() until the new
      result lands. Neither app blocks on the result; both show "---" until valid data
      arrives. Any change to the queue depth, spinlock discipline, or result struct layout
      in dataTask.h affects both consumers.
    risk: low
    test_coverage: [T_X07_01]
    notes: |
      Added 2026-05-25 (QM audit finding 3). ADR-029 covers TLS root CA strategy for
      both endpoints. Interaction is benign under normal single-app use; risk window is
      rapid switching between Weather and Crypto apps before either fetch completes.

  - id: X008
    feature_a: weather-001
    feature_b: app-interface-001
    interaction_type: dependency
    description: |
      WeatherApp relies on App ABC lifecycle (app-interface-001) for correct init/resume/
      suspend/tick/handleInput dispatch. resume() enqueues DATA_FETCH_WEATHER so the
      app refreshes data on every switch-in. suspend() does nothing (stateless WRT
      ongoing fetch — dataTask result is available whenever polled). switchApp() in
      appShell correctly calls suspend() on the outgoing app before calling resume() on
      the incoming app, so no double-enqueue race exists at switch time.
    risk: low
    test_coverage: []
    notes: Added 2026-05-25 (QM audit). Same structural dependency applies to crypto-001; see X009.

  - id: X009
    feature_a: crypto-001
    feature_b: app-interface-001
    interaction_type: dependency
    description: |
      CryptoApp relies on App ABC lifecycle (app-interface-001) for correct init/resume/
      suspend/tick/handleInput dispatch. resume() enqueues DATA_FETCH_CRYPTO. Identical
      structural dependency as weather-001 ↔ app-interface-001 (X008). Any change to
      the resume() call site, the switchApp() sequence, or the dataTask enqueue contract
      affects both weather-001 and crypto-001.
    risk: low
    test_coverage: []
    notes: Added 2026-05-25 (QM audit). Mirror of X008 for the crypto consumer.

  - id: X010
    feature_a: io-001
    feature_b: stock-002
    interaction_type: conflict
    description: |
      The Spotify task (io-001) holds a persistent WiFiClientSecure session
      (~40 k of internal heap) between polls. At steady state this leaves
      maxAlloc ≈ 39 k — below the ~50–70 k a new Yahoo Finance TLS handshake
      requires. Any heatmap auto-refresh (stock-002, 120 s cadence) fails with
      SSL -32512 (Memory allocation failed) unless Spotify's TLS is released
      first.

      Fix (TASK-131 / git c82b4d1): spotifyTask::heatmapPause() stops the
      Spotify client before the fetch and blocks until the task acknowledges
      (binary semaphore, up to 5 s). heatmapResume() releases the task to
      reconnect on its next natural poll. The pause/resume call-site is
      fetchHeatmapQuote() in dataTaskStorage.cpp.

      Invariant: any future dataTask fetch that needs its own TLS session
      while Spotify is live MUST wrap the fetch with heatmapPause() /
      heatmapResume(), or arrange equivalent TLS yield, to avoid this OOM.
    risk: high
    test_coverage: [T216, T217]
    notes: |
      Confirmed on DUT 2026-06-04: 10-min soak post-fix, 5 fetches all 200,
      maxAlloc min=39k (between fetches, with Spotify reconnected), 0 violations.
      heap probe LOG_HEAP macro added to all dataTask fetch functions to surface
      regressions via the serial debug log (dataTask.{weather,crypto,stock} tags).

