  - id: X043
    feature_a: vu-002
    feature_b: webradio-001
    interaction_type: shared_state
    description: |
      vu-002's real-audio envelope is written to vu::lLevelRef()/rLevelRef() from
      webradio-001's wrAudio pump task — a different FreeRTOS task from the UI thread that
      normally owns those statics via vu::tick(). This is a single-writer swap, not a lock:
      whichever mode is active (Spotify synthetic vs. WebRadio real) is the sole writer for as
      long as it's active, never both at once. Depends on 32-bit float writes being atomic on
      Xtensa (same assumption already relied on by the wrPump observability counters).

      Mechanism (not just convention): switchApp() calls the outgoing app's suspend()
      synchronously, on the same loopTask, before the incoming app's init()/resume() runs — no
      window for both to be active. WebRadioApp::suspend()'s _stopAudio() blocks on
      s_wrAudioMutex (portMAX_DELAY) around stopSong() — the same mutex the pump task holds
