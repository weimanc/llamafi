      duty directly, only through g_backlight.
    risk: medium
    test_coverage: []
    notes: |
      Reserved 2026-07-16 at design time by M-SETTINGS-WIRE2 §4-G5 (Architect registry
      remit). IMPLEMENTED 2026-07-17 (49297a3): BacklightFlow global owner (boot
      applyMode honours dispAuto; ticks in every app); DisplaySection demoted to
