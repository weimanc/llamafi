      T-SETW-14/15 at suite landing.

  - id: X034
    feature_a: settings-webradio
    feature_b: webradio-001
    interaction_type: dependency
    description: |
      On-device WebRadio settings UI (M-WEBRADIO-SETTINGS) couples to the radio app
      through the D3 resume-diff contract (r2, post-review): webRadioApp snapshots
      country+bitrateCap at each station-list fetch; resume() diffs against g_settings
      and on mismatch resets _currentIdx, clears the list, aborts any in-flight fetch
      (abortWebRadioFetch), and re-enqueues via the TASK-289 second-chance path.
      RESULT IDENTITY is mandatory (WR-1 blocker): WebRadioStationsResult carries
      country+cap echoes and the install site discards mismatches — without it a
      stale parked/in-flight old-country result repopulates the list AFTER the diff
      (TASK-300 pattern). webRadioLastStation resets to 0 AT EDIT TIME in the
      section's country/cap commit (rides its saveSettings(); closes the WR-2 reboot
      window — a resume()-time RAM reset persists new-country + old-index to flash).
      The persisted value is an INDEX into the fetched list — either edit voids
      station identity. Autoplay must NOT fire across a config change.
      A no-edit Settings round-trip must NOT refetch (TASK-284 rate-limit
      sensitivity). Volume: the UI slider stores webRadioMaxVolume 1..21 but
      wrEffectiveVolume() (TASK-209) remains the single clamp authority — hwMod stays
      serial/spiffs-only. No taskbar edge: the cfg column feeds only
      Settings->Applications; X022's eject-only invariant is unaffected.
    risk: medium
    test_coverage: [T-WRSET-01, T-WRSET-02, T-WRSET-03, T-WRSET-04, T-WRSET-05,
                    T-WRSET-06]
    notes: |
      Reserved 2026-07-16 at design time by M-WEBRADIO-SETTINGS §5 (Architect registry
      remit). IMPLEMENTED 2026-07-17 (fff0208): country+cap result echoes + install-
      site discard, edit-time lastStation resets, resume-diff + abort, coalesced
      suspend save, phase-forwarded volume slider, cfg=1 registry flip, default cap
      128. Suite fully PASS on DUT 2026-07-17 (01/04 via the 16b8acc debug hooks,
      05 re-run via dataq wrEnqueues). WR-4 coordinate re-derivation across settings
      suites — DONE 2026-07-17 (later session, VE/DUT real-data pass): only
      app-settings-wire-001.md needed the fix (m-clock-styles.md and
      m-pr-locations-dut.md carry no hardcoded Applications-list taps); see
      test_plan.md's WR-4 entry and app-settings-wire-001.md's updated layout table.

  - id: X035
    feature_a: home-location-001
    feature_b: pr-locations-001
    interaction_type: shared_state
    description: |
      Device home = prLocs[0] (M-HOME-LOCATION D1b): the Time & Location lat/lon
      fields become a load-derived write-through mirror of slot 0, consumed by
      weather (WIRE2 G4). TWO mirrors exist after this design (H-1 r2): the ACTIVE
      mirror prLat/prLon (X026) and the HOME mirror lat/lon — writers refresh BOTH
      where applicable per the design's writer×mirror matrix (D2), routed through
      one shared helper. Obligations: (a) the city picker becomes a prLocs[0]
      WRITER — home mirror always, active mirror iff prActiveLoc==0 (the default
      case — skipping it leaves the radar silently stale); (b) the HOME-slot
      editor refines coords only — tz and city name stay city-picker-owned; slot-0
      edits refresh the home mirror UNCONDITIONALLY even when slot 0 is not active
      (H-2); (c) radar active-slot switching (prActiveLoc) must NEVER move home —
      weather is pinned to slot 0, not the active slot; (d) the D4 migration (seed
      slot 0 from city iff slot 0 is still the untouched compile default, epsilon +
      kCities-membership guarded) runs AFTER X025's prLocs load invariants.
      Supersedes X032's empty-city fallback story: slot 0 is always defined, so
      weather always has coordinates.
    risk: medium
    test_coverage: [T-HOME-01, T-HOME-02, T-HOME-03, T-HOME-04, T-HOME-05, T-HOME-06]
    notes: |
      Reserved 2026-07-16 at design time by M-HOME-LOCATION §5 (Architect registry
      remit). IMPLEMENTED 2026-07-17 (dcc12bf): prSlotWritten() shared helper is the
      single writer x mirror site (fixes the X026/H-3 serial-writer no-mirror bug);
      dual mirror derivation at load; D4 migration kCities+epsilon guarded;
      PR_DEFAULT_LAT/LON constant unifies the literal sites; >500km hint + divKm +
      get prloc home observables. Suite fully dispositioned 2026-07-17 (later,
      real-data DUT session, snapshot-guarded, human-authorized): T-HOME-01/03/06
      PASS (earlier session); T-HOME-02/05 PASS and T-HOME-04 RUN+PASS (this
      session) — see test_plan.md per-test entries. All six T-HOME tests closed.
      Residual noted by implementer (manual-entry confirm path, TASK-322, shows no
      divergence hint — Lookup path only) **dispositioned in T-HOME-05 (2026-07-17)**:
      accepted as-is for v1, a deliberately-scoped limitation per the design's own
      "no Retry concept for manual entry" comment, not a defect. No follow-up filed.

