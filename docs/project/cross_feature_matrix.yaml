  - id: X059
    feature_a: pledit-edit-001
    feature_b: m3u-001
    interaction_type: dependency
    description: |
      Edit operations mutate only the RAM index (reorder = permute two uint32 offsets, delete =
      memmove, add = staged entry in a bounded arena); nothing reaches the card until SAVE,
      which streams the index in order into <name>.m3u.tmp and renames. Staged entries have no
      backing offset yet, so the writer must emit them from the staging arena rather than by
      seeking the source file — a case the naive copy loop gets silently wrong (drops the added
      tracks while reporting success).
    risk: medium
    test_coverage: []
    notes: |
      Round-trip verification is host-side: write from the device, pull the file off the card,
      diff against the expected order. Do not verify save by re-reading through the same index
      that produced it.
      ---
      PLANNED COVERAGE (2026-08-17, P0: only ids with a running body are listed above.) T_PLR_31 - blocked on TASK-424.
  # ── M-WINAMP-PLAYER shuffle/repeat amendment (Architect, 2026-08-07) ───────
  # Design §4.8/§4.9, ADR-059 D8/D9.

  - id: X060
    feature_a: playorder-001
    feature_b: chrome-001
    interaction_type: dependency
    description: |
      playorder-001 reuses chrome-001's shipped assets and render path VERBATIM: the SKIN_SHUFREP
      75x30 atlas (SR_SHUFFLE_ON/OFF, SR_REPEAT_ON/OFF), drawShuffle()/drawRepeat() at SHUFFLE_X=164
      / REPEAT_X=211, hitShuffle()/hitRepeat(), and the SHUFREP_OPTIMISTIC_HOLD_MS cache. No bake,
      no crop, no new sprite. Player's binary repeat is encoded inside chrome-001's existing
      tri-state domain (emits only 2=off and 0=repeat-all) so drawRepeat()'s `s != 2 -> ON` rule is
      byte-for-byte unchanged and Spotify's 2->1->0->2 cycle is unaffected.
    risk: low
    test_coverage: [T_PLR_19]
    notes: |
      The constraint runs the other way too: chrome-001's repeat sprite pair is now shared by two
      modes with different state domains. Anyone adding a third repeat state (repeat-one) must add a
      synthetic glyph rather than a fifth sprite — the atlas is packed 75x30 and its geometry is
      baked into skin_layout.h.

  - id: X061
    feature_a: playorder-001
    feature_b: webradio-001
    interaction_type: shared_state
    description: |
      The capability mask (ADR-059 D8) rewrites handleWinampInput()'s "Spotify-only zones"
      hardcoding — the same hardcoding that forced WebRadio's handleVolumeGesturePublic() narrow
      entry point to exist. WebRadio advertises CAP_TRANSPORT only, so it must render and hit-test
      exactly the zones it does today and no more. This is a pure refactor for WebRadio; any
      behavioural delta is a regression, not a feature.
    risk: high
    test_coverage: [T_PLR_17, T_PLR_18, T_PLR_19]
    notes: |
      Exit criterion 5b is the check. handleVolumeGesturePublic() can be retired once the mask lands
      — but retire it deliberately in its own commit, not as a side effect: it is shared state with
      the D_VOLUME_DRAG machine (TASK-352) and WebRadio's volume-drag path already cost TASK-406 a
      missing-log-line bug.

  - id: X062
    feature_a: playorder-001
    feature_b: plmodel-001
    interaction_type: shared_state
    description: |
      Shuffle permutes playOrder[] ONLY. viewOrder[] — what PLEDIT renders and what SAVE writes —
      is never touched by shuffle, and reorder never touches playOrder (dragging a row must not make
      the playback queue jump). Delete must drop the entry id from BOTH permutations and fix the bag
      cursor if it pointed past the removed slot; add appends to both so a newly added track plays
      this cycle. Tap-to-play moves the bag cursor to that entry's position in playOrder (O(N) scan)
      rather than reshuffling.
    risk: high
    test_coverage: []
    notes: |
      The destructive failure this split exists to prevent: shuffle ON + reorder + SAVE writing
      SHUFFLED order to the card, silently destroying the user's playlist. Exit criterion 5a
      verifies it host-side, from the card — not by re-reading through the same structure that
      produced the write.
      ---
      PLANNED COVERAGE (2026-08-17, P0: only ids with a running body are listed above.) T_PLR_30 - blocked on TASK-424. X062 is OBSERVED, NOT CLOSED by M-TESTBASE phase 1.
  - id: X063
    feature_a: playorder-001
    feature_b: localplay-001
    interaction_type: resource_contention
    description: |
      Auto-advance is driven by the audio_eof_mp3() weak callback, which the vendored ESP32-audioI2S
      declares but nothing in this firmware currently implements. It fires on the AUDIO PUMP TASK,
      from inside Audio::loop(), while the engine mutex is held. It may therefore only set a flag;
      the actual open-next-track work (SD read, playlist model, display update) runs on loopTask's
      next tick. Calling connecttoFS() from the callback re-enters the engine mutex from the task
      that already holds it — self-deadlock.
    risk: high
    test_coverage: [T_PLR_25]
    notes: |
      Same single-writer/post-a-request discipline as the existing wrPumpConnect path (TASK-398) and
      the X043/X044/X048 audio_process_extern edges. Reuse that pattern; do not invent a second one.
      Note also that audio_eof_mp3 is the natural place a naive implementation would advance the
      shuffle bag — the bag lives in loopTask-owned state and must not be mutated from the pump task.
      ---
      TASK-443 (2026-08-15) raises this edge's weight. Audio frees the Helix buffers at EVERY
      end-of-file (Audio.cpp:3053) and reallocates on the next connecttoFS (:3769), with the
      audio_eof_mp3 hop and an SD File open (~4.4 KB stdio buffer, TASK-415) landing in the hole
      between. Auto-advance is what drives that churn, so playorder-001 is the feature that
      exercises localplay-001's allocator hardest — and post-ruling those allocations come from
      the general heap rather than a reserved block, where fragmentation is a real outcome rather
      than an arena-internal bookkeeping detail. A single-track play proves nothing about track 4.
      COVERAGE CLAIMED, NOT YET EARNED: T_AE_12 walks two full laps of a 5-track playlist and
      samples lfb8 at all ten track starts; a monotone decline across the ten fails the id even if
      audio never stuttered. Its threshold is explicitly provisional until a first green run
      publishes the real spread.
      ---
      PLANNED COVERAGE (2026-08-17, P0: only ids with a running body are listed above.) T_AE_12 (blocked).
  - id: X064
    feature_a: player-state-001
    feature_b: app-registry-001
    interaction_type: dependency
    description: |
      ADR-059 D10 makes the three player modes compile-time optional via presence flags
      (-DPLAYER_SPOTIFY / -DPLAYER_WEBRADIO / -DPLAYER_LOCAL, never =0 per LL-006), removing an
      absent mode's appRegistry.h row, object and header. Four consequences do NOT fall out
      automatically: (1) mode cycling must iterate the compiled-in set — a single-mode build must not
      cycle; (2) a persisted g_settings.playerMode naming an absent mode must fall back to the first
      compiled-in mode, or resolvePlayerSlot() returns a null app = boot crash; (3) TASKBAR_APP_COUNT
      must be computed from the compiled-in enum tail, not a literal; (4) Settings > Applications >
      Player lists only compiled-in modes.
    risk: high
    test_coverage: []
    notes: |
      Consequence (2) is the dangerous one: it only triggers on a variant reflash over an existing
      settings.json, so it will not show up in a clean-flash test. Exercise it deliberately.
      Build-matrix cost is deliberately bounded: ONE new dev env (cyd2usb_player, Player only),
      mirroring the existing cyd2usb_webradio precedent — check_build.sh gates go 6 -> 7, not 6 -> 13.
      A full 2^3 matrix is explicitly rejected. Existing -DDISABLE_SPOTIFY stays as-is (load-bearing
      for the harness's `get variant` fast path); do not migrate it in this milestone.
      ---
      PLANNED COVERAGE (2026-08-17, P0: only ids with a running body are listed above.) T_PLR_36, T_PLR_37 - both blocked: no shipping env defines -DPLAYER_SPOTIFY/-DPLAYER_WEBRADIO/-DPLAYER_LOCAL.
  # ── RESERVED by Architect 2026-08-16 (AGENTS.md rule 10) ──────────────────────
