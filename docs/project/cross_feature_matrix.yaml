  - id: X015
    feature_a: dataTask (Core 0 fetch functions)
    feature_b: serialdbg (Core 1 serial handler)
    interaction_type: shared_state
    description: |
      dataTask fetch functions (fetchStockQuote, fetchCrypto, fetchWeather,
      fetchHeatmapQuote) run on Core 0 and publish committed results atomically via
      spinlock-protected result structs. Core 1's serialdbg handler can query app-layer
      state (quoteOkCount, fetchErrorCode, cryptoReady, etc.) but only sees the last
      committed result — not in-progress state. If a fetch hangs mid-execution, all
      Core 1 diagnostics reflect default/stale values with no indication of where the
      hang occurred.

      M-DATATASK-PROGRESS addresses this gap by adding volatile int8_t progress atoms
      updated per-step in each fetch function. These are readable from Core 1 at any
      time without a lock (single-byte write, ESP32 byte writes are atomic). The pattern
      is applicable to any multi-step Core 0 function that can take >5 s and has
      distinct observable phases.

      Confirmed pain point: T170 / T188 fail in full-suite runs with fetchFailed=False,
      fetchErrorCode=None — indicating fetchStockQuote() never completed, not that it
      failed. Without a progress indicator, the hung ticker (0–7) is invisible to tests.

      Open question (see M-DATATASK-PROGRESS §Open question): which other fetch functions
      benefit from phase-level progress indicators? Candidates include fetchWeather
      (TLS/GET/parse phases), fetchCrypto (TLS/GET/parse), fetchHeatmapQuote (TLS/stream).
    risk: medium
    test_coverage: [T170, T188]
    notes: |
      Diagnosed 2026-06-12 during T170/T188 root-cause investigation. Added fetchErrorCode
      diagnostic to T170/T188 failure path (commit pending); result was fetchFailed=False,
      fetchErrorCode=None — confirming hang rather than error. Design in
      docs/architecture/designs/M-DATATASK-PROGRESS.md.

  - id: X016
    feature_a: teletext-001
    feature_b: touch-004
    interaction_type: dependency
    description: |
      TeletextApp::hasPendingAsync() returns `_pendingFetch`, which is true from the
      moment a page fetch is enqueued (via _navigate(), _goBack(), or tick() periodic
      poll) until pollTeletext() returns a result. Shell polls hasPendingAsync() after
      every touch event and every tick(); while true, setBusy(true) fires, painting the
      taskbar active-slot indicator amber and blocking further touch input via the
      g_shellBusy gate in appHandleInput().

      Critical: _navigate() and _goBack() direct-enqueue via dataTask::enqueueTeletextPage()
      AND set _pendingFetch = true. tick() guards its own enqueue path with !_pendingFetch,
      so these two paths are mutually exclusive — exactly one fetch is in flight at any time.
      After poll success tick() sets _pendingFetch = false, shell clears busy to green.
    risk: low
    test_coverage: [T-BUSY-01, T-BUSY-02, T-BUSY-03]
    notes: |
      Wired 2026-06-14. Before this, TeletextApp did not override hasPendingAsync()
      (default false), so the busy indicator never fired for teletext navigation.
      _navigate()/_goBack() also previously set _pendingFetch = false immediately after
      direct-enqueueing, which would have caused a double-enqueue on the next tick().

