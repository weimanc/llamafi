  - id: serialdbg-001
    name: Serial debug command framework (M-SERIALDBG)
    description: |
      Table-driven serial command dispatcher in handleSerialCommands(). Two build modes:
      cyd2usb_winamp (production — only `reconnect` compiled in) and cyd2usb_winamp_debug
      (test rig — full `tap` / `drag` / `get` / `set` / `info` / `help` surface gated by
      SERIAL_DEBUG). All responses are JSON lines (`\n`-terminated) for `json.loads`-driven
      host scripts. Touch injection via virtual injectTouch / injectRelease on
      SpotifyDisplay (no static_cast coupling); cmdDrag fills a 64-slot injection ring
      buffer drained one sample per loop iteration (no delay() in loop task). Unconditional
      boot version line `[boot] git=<hash> elf=<8hex> build=<date> <time>` ships in both
      envs as a passive diagnostic; GIT_REV injected via pre:scripts/inject_git_hash.py.
