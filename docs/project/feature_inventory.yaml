  - id: conn-001
    name: Connection recovery (M-CONN)
    description: |
      Health + recovery surface around the async Spotify poll task. spotifyTask::isHealthy()
      returns s_consecutiveFailures < 2; resetTls() sets volatile s_resetTlsPending and
      zeroes the failure counter, the task body calls client.stop() on its own stack
      before the next poll (avoids cross-task mbedTLS races). Three user-facing triggers:
      a serial `reconnect` command in handleSerialCommands(), a tap on the Winamp logo
      (hitTestLogo at LOGO_X/Y/W/H = 250,100,25,16 window-local, 2 s logoTapCooldownMs),
