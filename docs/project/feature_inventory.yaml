      spotifyTask::dbg_get/dbg_set (unified, handles "snapshot"/"backoff"/"heap"/"queue")
      and WinampDisplay::dbgGet/dbgSet override (handles "cooldown"/"dragState"/
      "optimisticVolume"/"songDuration"). debugExportable.h defines the interface;
      SpotifyDisplay base provides default no-ops; non-Winamp backends compile unchanged.
