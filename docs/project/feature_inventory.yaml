      Bakes and renders the remaining Winamp 2 main-window chrome elements from the .wsz skin. Tier 1: SHUFREP atlas (75×30 px, 4 sprites) for shuffle/repeat indicators + tap-toggle; static composite patches MAIN_BG at bake time (TITLEBAR active variant, BALANCE centred, kbps "192", kHz "44", MS_STEREO_ON, MS_MONO_OFF, eject button). Tier 2: VOLUME atlas (6 keyframes × 68×13 px + sentinel, 10 608 bytes) for a dynamic volume slider driven by device.volume_percent from /me/player. Tier 2.5: drag-to-set volume touch control with 300 ms debounce, optimistic-UI freeze (2 s), and volume knob sprite (14×11 px from BALANCE.BMP). All dynamic state sourced from spotifyTask::Snapshot (shuffleState, repeatState, volumePercent). ADR-014 (static composite), ADR-016 (volume drag).
    status: implemented
    git_ref: Spotify-Diy-Thing@2026-05-10 (TASK-025 last — 2026-05-15)
    files:
      - Spotify-Diy-Thing/tools/bake_skin.py
      - Spotify-Diy-Thing/SpotifyDiyThing/gen/skin_assets.c
      - Spotify-Diy-Thing/SpotifyDiyThing/gen/skin_layout.h
      - Spotify-Diy-Thing/SpotifyDiyThing/winampDisplay.h
      - Spotify-Diy-Thing/SpotifyDiyThing/spotifyTask.h
      - Spotify-Diy-Thing/SpotifyDiyThing/spotifyTaskStorage.cpp
      - Spotify-Diy-Thing/lib/SpotifyArduino/src/SpotifyArduino.h
      - Spotify-Diy-Thing/lib/SpotifyArduino/LOCAL_PATCHES.md
