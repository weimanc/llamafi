      DATA_FETCH_STOCK_CHART (single ticker/range). Quote fetch every 60 s; chart fetch
      every 60 s (D1) or 300 s (5D/1M/6M). fetchStockQuote() and fetchStockChart()
      use http.getStream() — Yahoo Finance returns Content-Length (not chunked), so
      streaming parse is safe and eliminates double-allocation (ADR-034).
      Serial debug: get stockSubView, get stockChartTicker, get stockChartRange,
      get lastQuoteFetch, get lastChartFetch, get fetchErrCount, set fetchFailed,
      set fetchErrorCode, set triggerFetch (resets both fetch timestamps to 0),
      set fetchErrCount 0 (manual reset). fetchErrCount is a cumulative error counter
      that never auto-clears — survives app switches and successful retries, so the
      agent can confirm errors occurred even after fetchFailed has cleared.
