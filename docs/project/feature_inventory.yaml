  - id: conn-002
    name: HTTP/1.1 keep-alive + chunked dechunker (M-CONN-HTTP11)
    description: |
      Upgrades SpotifyArduino from HTTP/1.0 (connection-close) to HTTP/1.1 keep-alive,
      eliminating TLS handshake overhead on every poll. makeGetRequest/makeRequestWithBody
      send HTTP/1.1 + Connection: keep-alive; conditional reconnect keyed on
      _connectedHost[64]; single retry on write failure; delay(200) after every stop()
      before connect(). skipHeaders() redesigned to read line-by-line, returning
      HeaderInfo {contentLength, chunked}. All deserializeJson sites converted to
      buffer-then-parse (malloc + readBytes) to avoid stream-hang under keep-alive.
      getQueue() extended with a dechunker: reads HEX\r\n DATA \r\n chunk frames into
      bodyBuf, stopping on the terminal 0\r\n chunk (TASK-065 fix for PLEDIT empty).
    status: implemented
    git_ref: Spotify-Diy-Thing@inner-main-ab3864e (TASK-063 + TASK-065)
