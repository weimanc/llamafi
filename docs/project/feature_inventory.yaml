    notes: |
      Tier 1 (TASK-040, TASK-025, TASK-046): static composite baked into SKIN_MAIN_BG (no runtime cost); SHUFREP 4-sprite atlas (shuffle off/on, repeat off/on); eject composite. Shuffle/repeat tap-toggle dispatches ACT_SHUFFLE/ACT_REPEAT through spotifyTask; optimistic-UI paints new sprite immediately; 2 s freeze gates snap-driven redraw.
      Tier 2 (TASK-041, TASK-044): VOLUME atlas 6 keyframes (0/28/56/84/112/140 % thresholds) + synthesised KEYFRAME_NONE (greyed empty track, sentinel for volumePercent=-1). Volume knob sprite tracks the keyframe pixel-position. Driven by device.volume_percent from /me/player (TASK-043).
