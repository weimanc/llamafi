  - id: app-error-signal-001
    name: Per-app error state + red taskbar active-bar signal
    milestone: M-MULTIAPP
    status: implemented
    description: |
      Generic per-app error endpoint on the App base class, surfaced as a third taskbar
      active-slot indicator state. Today the 3px active-slot bar (taskbar/taskbar.h:
      renderActiveIndicator) shows green (TASKBAR_ACTIVE_COLOR 0x07E0, idle) or amber
      (TASKBAR_BUSY_COLOR 0xFD20, g_shellBusy). This adds red (TASKBAR_ERR_COLOR 0xF800,
      firmware-only #define — NOT in shell_layout.h, to preserve the check_build golden hash)
      for a sustained error state, plus an amber "connecting" state at boot (ADR-046 amendment),
      with precedence error (red) > busy|connecting (amber) > idle (green).
      Endpoints (both sibling of hasPendingAsync(), default false): virtual bool App::hasError()
      and virtual bool App::isConnecting() (appShell.h). Sticky — app sets on error, clears on
      next success; shell does no latching. First/only consumer at mechanism stage:
      SpotifyApp::hasError() on a persistent 403 (spotifyTask::authError()) and
      SpotifyApp::isConnecting() until the first poll resolves (spotifyTask::connecting(),
      s_lastSuccessfulPollMs==0).
      isConnecting() is wired for every NETWORK taskbar app (each to its own first-data signal):
      Weather (!s_wxDataReady), Crypto (!s_cxDataReady), Stock (!_everHadData — first successful
      quote/chart/heatmap), Teletext (!_st.ready) — amber on entry → green when data lands.
      hasError() (red) is also wired for all four (TASK-246): a failed fetch latches red, cleared
      on the next success — Weather _wxErr, Crypto _cxErr, Stock _s.fetchFailed (incl. heatmap),
      Teletext _ttErr. Precedence error(red) > connecting(amber), so a failed first fetch shows
      red not amber. (Weather consume also fixed to honour r.ok — was showing 0s on failure.)
      Offline apps (Clock/Matrix/Life/Aquarium/Settings) and eject-only WebRadio keep all
      defaults false.
      Accepted limitation (ADR-046 §4): recolours the ACTIVE app's bar only — an app's error is
      visible only while it is the active app (no persistent per-slot dot). 403 starvation
      (TASK-244) makes other apps slow not failed, so they go red only on a genuine fetch error.
    files:
      - app/src/appShell.h
      - app/src/taskbar/taskbar.h
      - app/src/main.cpp
      - app/src/spotifyTask.h
      - app/src/spotifyTaskStorage.cpp
      - app/src/teletextApp.h
      - docs/architecture/decisions/ADR-046.md
    cross_features:
      - app-registry-001
      - taskbar-icons-001
      - poll-001
      - data-task-001
    test_ids: [T-ERR-01, T-ERR-02, T-ERR-03, T-ERR-04, T-ERR-05, T-ERR-06, T-ERR-07]
    dependencies:
      - app-registry-001
    notes: |
      Design: ADR-046 (accepted 2026-06-25). Split into TASK-245 (mechanism + Spotify consumer
      + matrices + VE) and TASK-246 (audit + wire every app's error state; gated on TASK-245).
      Ties to TASK-244 (same Spotify 403 signal). cross_feature_matrix combinations X017-X020.

  - id: player-state-001
    name: Player mode as persisted, user-editable state (Spotify | WebRadio)
    milestone: M-PLAYER-STATE
    status: partial
    description: |
      The "player" is one slot with two mutually-exclusive modes {Spotify | WebRadio}; eject
      toggles the mode and the taskbar player slot restores the last-active one (instead of always
      Spotify). WebRadio stays its own eject-only AppId (taskbar-excluded — TASK-242/LL-085
      invariant preserved); the mode field only selects which the player slot resolves to.
      PART 1 (implemented, TASK-259, RAM-only, commit a825521): g_lastPlayerMode tracked in
      switchApp() when the player enters Spotify or WebRadio; resolvePlayerSlot() redirects a
      taskbar tap on the player slot (AppId::Spotify — the only mode a taskbar tap can surface,
      WebRadio being eject-only) to the remembered mode, wired at both taskbar gesture-end sites.
      Eject already toggled both ways (Spotify->WebRadio at the eject handler; WebRadio->Spotify
      at webRadioApp.h:309); settings-back already restored via g_previousAppId — unchanged.
      PART 2 (designed, not yet implemented — this feature's remaining scope): persist the mode to
      SPIFFS settings.json (collapse g_lastPlayerMode into g_settings.playerMode, single source of
      truth; new top-level "player" object) so it survives reboot; and a Settings -> Applications
      -> Player show/edit/toggle row (flip Spotify appRegistry cfg 0->1, regenerate
      gen/configurable_apps.h via gen_app_registry.py, add _repaintPlayer/_cyclePlayer to
      appsSection.h). Cold-boot stays on the Spotify view for v1 (boot-into-mode is deferred and
      composes with the existing webRadioAutoplay knob).
