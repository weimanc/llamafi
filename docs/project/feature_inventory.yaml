  - id: cal-001
    name: CalibrationFlow — XPT2046 runtime touch calibration
    description: |
      CalibrationFlow : SettingsSection (section 2) guides user through 4-corner tap
      sequence to calibrate XPT2046 resistive touch. Raw touch path: SettingsApp::tick()
      polls ts.getPointRaw() when stepping() is true, accumulates samples on Press, averages
      on Release per corner. _computeCalibration() linear-fits 4 corners → xMin/xMax/yMin/yMax,
      sanity-checks span>1000 and range 0..4095. Accepted cal saved to /cal.json (SPIFFS),
      ts.setCalibration() called immediately (PATCH-002). Boot: TouchCalStorage::load() in
      setup(), ts.setCalibration() if g_calData.valid.
      TouchCalData persisted as JSON; factory anchor always preserved in history array.
      Idle view: shows current values + source (SPIFFS/factory default).
      Review view: new vs. current delta; Accept/Retry/Cancel buttons; Accept dimmed on
      sanity failure.
