# feature_inventory.yaml
# Owner: Developer
# Updated by: Developer on every feature addition, change, or removal
# Read by: PM (oversight), VE (test planning), QM (auditing)
#
# Scope: Spotify-Diy-Thing/ only. cspot/ is vendored and out of scope.

features:
  - id: deploy-001
    name: First-time bring-up procedure
    description: End-to-end procedure to flash a blank CYD2USB unit, bake Spotify creds into SPIFFS, configure wifi, and start polling Spotify Web API. Documented in docs/first_time_run_deploy.md.
    status: implemented
    git_ref: ""
    files:
      - docs/first_time_run_deploy.md
      - get_refresh_token.py
      - Spotify-Diy-Thing/platformio.ini
      - Spotify-Diy-Thing/data/spotify_diy_config.json
    cross_features: [auth-001, cfg-001]
    test_ids: []
    notes: Platform pinned to espressif32@6.9.0. Hardware target is the two-USB CYD variant; uses the cyd2usb PlatformIO env (TFT_INVERSION_ON).

  - id: auth-001
    name: Spotify OAuth refresh-token bootstrap
    description: Off-device Authorization Code flow against http://127.0.0.1:8888/callback/ (Spotify's loopback-only HTTP exception). Helper script captures the refresh token; baked into SPIFFS instead of running the device's built-in flow which Spotify's redirect-URI policy now rejects.
    status: implemented
    git_ref: ""
    files:
      - get_refresh_token.py
      - Spotify-Diy-Thing/SpotifyDiyThing/refreshToken.h
    cross_features: [cfg-001, time-001]
    test_ids: []
    notes: On-device flow in refreshToken.h is dead code under current Spotify policy; kept for reference but not reachable via dashboard-allowed redirect URIs.

  - id: cfg-001
    name: Persisted Spotify config (SPIFFS)
    description: JSON config at /spotify_diy_config.json holding clientId, clientSecret, refreshToken. Read on every boot; written either by the captive portal's save callback or pre-baked via PlatformIO `uploadfs`.
    status: implemented
    git_ref: ""
    files:
      - Spotify-Diy-Thing/SpotifyDiyThing/configFile.h
      - Spotify-Diy-Thing/data/spotify_diy_config.json
    cross_features: [wifi-001]
    test_ids: []
    notes: Keys are clientId/clientSecret (lowercase 'd'). NVS holds wifi creds separately.

  - id: wifi-001
    name: Wifi captive-portal setup (WiFiManager)
    description: First-boot AP `SpotifyDIY` / `thing123`. Configure WiFi page also exposes Client ID / Secret / Refresh Token text fields. Double-press reset within ~10s re-enters config mode (DoubleResetDetector).
    status: implemented
    git_ref: ""
    files:
      - Spotify-Diy-Thing/SpotifyDiyThing/WifiManagerHandler.h
    cross_features: [cfg-001, time-001]
    test_ids: []
    notes: Config-portal "Info" page does not show the Spotify text fields — only "Configure WiFi" does. Saving from Info silently writes empty client creds.

  - id: poll-001
    name: Currently-playing poll loop
    description: Polls /v1/me/player/currently-playing periodically, decodes JPEG album art, updates display. 204 No Content handled as "nothing playing".
    status: implemented
    git_ref: ""
    files:
      - Spotify-Diy-Thing/SpotifyDiyThing/SpotifyDiyThing.ino
      - Spotify-Diy-Thing/SpotifyDiyThing/spotifyLogic.h
    cross_features: [disp-001, api-001]
    test_ids: []

  - id: disp-001
    name: CYD LCD rendering
    description: TFT_eSPI-based 320x240 ILI9341 panel rendering — track + artist text, album art JPEG, progress bar.
    status: implemented
    git_ref: ""
    files:
      - Spotify-Diy-Thing/SpotifyDiyThing/cheapYellowLCD.h
      - Spotify-Diy-Thing/SpotifyDiyThing/spotifyDisplay.h
      - Spotify-Diy-Thing/DisplayConfig/User_Setup.h
    cross_features: []
    test_ids: []
    notes: Panel polarity differs between single-USB and two-USB CYD variants; cyd2usb env sets TFT_INVERSION_ON. The cyd env produces inverted colors on this hardware.

  - id: touch-001
    name: Touch input (prev / next track)
    description: Tap left third → previous track, tap right third → next track. Middle band is a dead zone. No play/pause, volume, or seek.
    status: implemented
    git_ref: ""
    files:
      - Spotify-Diy-Thing/SpotifyDiyThing/touchScreen.h
      - Spotify-Diy-Thing/SpotifyDiyThing/CYD28_TouchscreenR.cpp
      - Spotify-Diy-Thing/SpotifyDiyThing/CYD28_TouchscreenR.h
    cross_features: []
    test_ids: []
    notes: Seek bar is rendered but not interactive — see TASK-002.

  - id: time-001
    name: SNTP system-clock sync at boot
    description: configTime() against pool.ntp.org / time.google.com / time.cloudflare.com at the end of WiFi-up in setup(), before any TLS handshake. Bounded 5 s wait until time(nullptr) > 1700000000 (2023-11-14); non-fatal on timeout. Without this, ESP32's RTC-less clock starts ~1970, mbedTLS rejects current Spotify certs whose notBefore is in the future, and accounts.spotify.com TLS fails with a generic send error (X001).
    status: implemented
    git_ref: ""
    files:
      - Spotify-Diy-Thing/SpotifyDiyThing/SpotifyDiyThing.ino
    cross_features: [wifi-001, auth-001]
    test_ids: [T019, T020]
    notes: Fix for the 2026-04-28 boot-time TLS failure. Spike harness `i` command also reports current epoch + ISO-8601 UTC for verification.

  - id: api-001
    name: Spotify Web API capability spike (M1 de-risk)
    description: Throwaway harness exercising every Spotify Web API call the forthcoming Winamp UI will need. Single-character serial commands fire one call each; outcomes logged as [OK]/[FAIL]/[GET]/[ERR]. Covers play, pause, next, previous, seek, setVolume, toggleShuffle, setRepeatMode (all on SpotifyArduino), plus audio-features and audio-analysis (raw makeGetRequest with filtered ArduinoJson parse, using a vendored-library getBearerToken() patch). Build env cyd2usb_spike adds -DSPIKE_MODE; default cyd2usb env unchanged.
    status: implemented
    git_ref: Spotify-Diy-Thing@6066cab + (rotation/cleanups commit pending)
    files:
      - Spotify-Diy-Thing/SpotifyDiyThing/spikeMode.h
      - Spotify-Diy-Thing/SpotifyDiyThing/spikeRawHttp.h
      - Spotify-Diy-Thing/SpotifyDiyThing/SpotifyDiyThing.ino
      - Spotify-Diy-Thing/lib/SpotifyArduino/src/SpotifyArduino.h
      - Spotify-Diy-Thing/lib/SpotifyArduino/LOCAL_PATCHES.md
      - Spotify-Diy-Thing/platformio.ini
    cross_features: [poll-001, time-001, api-002]
    test_ids: [T001, T002, T003, T004, T005, T006, T007, T008, T009, T010, T011, T012, T013, T014, T015, T016, T017, T018, T019]
    notes: |
      M1 exit summary (DUT run 2026-04-29):
      - Auth chain (rotated creds + time-001 NTP sync) works end-to-end. Spike commands dispatch successfully from serial.
      - GET /v1/me/player/currently-playing: works (poll loop stable).
      - All POST/PUT control endpoints (next/previous/play/pause/seek/volume/shuffle/repeat): FAIL at TLS-send with mbedTLS 0x0050. Library reuses one WiFiClientSecure across request types; non-GET breaks. Tracked as TASK-009 / api-002.
      - GET /v1/audio-features/{id}, GET /v1/audio-analysis/{id}: HTTP 403 from Spotify. Endpoints deprecated for new Developer apps as of late 2024. Tracked as TASK-010 (ADR-002 invalidated).
      Spike code is throwaway but kept in tree until M5/M6 superseding fixes land. Not in regression suite.

  - id: api-002
    name: TLS connection lifecycle fix for non-GET endpoints
    description: Fix or replacement for the SpotifyArduino library's connection-reuse pattern that fails at TLS-send (mbedTLS 0x0050) for every POST/PUT after a prior GET. Candidate approaches per TASK-009; recommended is migrating affected endpoints to Arduino-ESP32 HTTPClient which manages connection lifecycle internally.
    status: planned
    git_ref: ""
    files: []
    cross_features: [api-001, poll-001]
    test_ids: []
    notes: Blocking M5 (full-skin touch controls), TASK-002, TASK-003. Architect to draft an ADR before implementation.

  - id: poll-002
    name: Position interpolation (M4 — smooth seek bar)
    description: Stash progressMs + millis() on each poll, derive displayed position each frame, snap on poll. Renderer (cheapYellowLCD::displayTrackProgress) is idempotent — caches lastBarXWidth and skips redraw on identical pixel position; track-change / seek-back take a shrink-branch full repaint. Tick lowered from 500ms to 100ms.
    status: implemented
    git_ref: Spotify-Diy-Thing@f84b112
    files:
      - Spotify-Diy-Thing/SpotifyDiyThing/spotifyLogic.h
      - Spotify-Diy-Thing/SpotifyDiyThing/cheapYellowLCD.h
      - Spotify-Diy-Thing/SpotifyDiyThing/SpotifyDiyThing.ino
    cross_features: [poll-001, disp-001]
    test_ids: []
    notes: |
      Closes ADR-006 M4 minimal scope. Local-seek field updates remain unwired pending api-002 (M5).
      Album art temporarily gated behind DISABLE_ALBUM_ART (.ino) — orthogonal i.scdn.co fetch hang, not part of this feature.
      No regression test yet — visual-only verification (TASK-011 close). VE backlog.

  - id: m2-001
    name: Skin asset bake tool (host-side)
    description: Standalone Python tool that converts a Winamp 2 .wsz skin into RGB565 atlas C arrays + a static layout header per ADR-003. Tier 1 covers main background, transport buttons (prev/play/pause/stop/next), and raw text.bmp font atlas. Pillow's BI_RLE8 BMP decoder fails on Winamp's TEXT.BMP; tool falls back to ImageMagick (`magick`) round-tripped through PNG.
    status: implemented
    git_ref: Spotify-Diy-Thing@a9682be
    files:
      - Spotify-Diy-Thing/skins/base-2.91.wsz
      - Spotify-Diy-Thing/tools/bake_skin.py
      - Spotify-Diy-Thing/SpotifyDiyThing/gen/skin_assets.c
      - Spotify-Diy-Thing/SpotifyDiyThing/gen/skin_layout.h
    cross_features: [disp-001]
    test_ids: []
    notes: |
      Tier-2 batch (Spotify-Diy-Thing@0e9057a, 2026-05-07) added SKIN_GLYPH[128] ASCII->UV table + golden hash; closes M3's asset-side dependency.
      Tier 3 deferred until M3 has a working renderer scaffold: time digits (NUMBERS.BMP), play/pause indicator (PLAYPAUS.BMP), seek bar sprites (POSBAR.BMP), title bar (TITLEBAR.BMP), VOLUME/BALANCE/MONOSTER/SHUFREP, eject.
      Build wiring: standalone, manual invocation. No PIO pre-build hook (per user pref).
      Atlas budget: 94 KB total RGB565 (MAIN 64K + CBUTTONS 10K + FONT 22K).
      External dep: ImageMagick CLI (`magick`). Document in deploy notes.

  - id: m3-001
    name: Winamp display backend (renderer scaffold)
    description: SpotifyDisplay backend that paints the Winamp 2 main window from the m2-001 atlas. Subclasses CheapYellowDisplay to inherit the JPEG/SPIFFS/touch plumbing; overrides showDefaultScreen/displayTrackProgress/printCurrentlyPlayingToScreen to draw via SKIN_MAIN_BG, SKIN_CBUTTONS, SKIN_GLYPH. Selected at compile time via -DWINAMP_DISPLAY (env cyd2usb_winamp).
    status: scaffold
    git_ref: ""
    files:
      - Spotify-Diy-Thing/SpotifyDiyThing/winampDisplay.h
      - Spotify-Diy-Thing/SpotifyDiyThing/SpotifyDiyThing.ino
      - Spotify-Diy-Thing/platformio.ini
    cross_features: [disp-001, poll-002, touch-001]
    test_ids: []
    notes: |
      Tier 1: 1x native (275x116) centered on the 320x240 CYD canvas, no scaling. Static background, transport buttons in normal state, ASCII-only title, plain progress rect, album art inherits.
      Tier 2 (Spotify-Diy-Thing@e4871e8, 2026-05-07): POSBAR sprite-based bar + thumb, PLAYPAUS status indicator, title marquee scroll (1500 ms hold, 120 ms step, edge clipping), pressed-button feedback in checkForInput.
      Build flash: cyd2usb_winamp 96.6% (atlas + render code now linked); default cyd2usb env unchanged (88.6%). DUT visual verify still pending.
      .ino orders WINAMP_DISPLAY ahead of YELLOW_DISPLAY because cyd2usb_winamp inherits common_cyd's -DYELLOW_DISPLAY.
      Open: NUMBERS sprite use (time digits not yet rendered — loaded but DCE'd until referenced), 2x scaling, eject/shuffle/repeat/volume controls, full TITLEBAR variants.

  - id: dev-001
    name: Hostile-network development shims
    description: Three opt-in mitigations for testing the DUT on networks that interfere with the default flow. (a) wifi_creds.h __has_include shim short-circuits WiFiManager portal with hardcoded SSID/PASS. (b) dnsOverride.h runs an AsyncUDP resolver on the DUT bound to :53, reading /host_overrides.json from SPIFFS and repointing lwip via dns_setserver(). tools/refresh_host_overrides.sh regenerates the table via dig. (c) httpsDate.h plain-HTTP Date-header time bootstrap with __DATE__/__TIME__ build-epoch last resort. All three are no-op when the relevant input is absent.
    status: implemented
    git_ref: Spotify-Diy-Thing@bf5d5ca
    files:
      - Spotify-Diy-Thing/SpotifyDiyThing/WifiManagerHandler.h
      - Spotify-Diy-Thing/SpotifyDiyThing/dnsOverride.h
      - Spotify-Diy-Thing/SpotifyDiyThing/httpsDate.h
      - Spotify-Diy-Thing/tools/refresh_host_overrides.sh
    cross_features: [wifi-001, time-001]
    test_ids: []
    notes: |
      Validated against AT&T tethered hotspot (DNS+TCP blocked, fail expected) and Marriott guest captive portal (works after MAC pre-auth via portal — separate workflow).
      gitignored: SpotifyDiyThing/wifi_creds.h, data/host_overrides.json — site/network specific.
      Not on the milestone roadmap. Dev-environment infra; expected to stay opt-in indefinitely.

  - id: log-001
    name: Logging redesign tier 1 — esp_log fan-out + 12 KB ringbuffer + /log endpoint + secret redactor + heartbeat
    description: ESP-IDF esp_log_set_vprintf hook fans every ESP_LOGx line to Serial + a 12 KB RAM ringbuffer (48 slots × 256 chars). Permanent post-WiFi HTTP server on WiFi.localIP() exposes GET /log[?n=N|?clear=1]. secret.h `redact()` (8-slot rotating pool) replaces the configFile.h JSON dump. logDecode.h decodes mbedtls / HTTP codes at log call sites. logHeartbeat.h emits a 30-second tag=hb INFO line with display, RSSI, heap, uptime, poll counters, last status, block_max_ms (added by io-001), build epoch.
    status: implemented
    git_ref: Spotify-Diy-Thing@2f2af07 (ADR-010 + amendments)
    files:
      - Spotify-Diy-Thing/SpotifyDiyThing/logSink.h
      - Spotify-Diy-Thing/SpotifyDiyThing/logSinkStorage.cpp
      - Spotify-Diy-Thing/SpotifyDiyThing/logServer.h
      - Spotify-Diy-Thing/SpotifyDiyThing/logDecode.h
      - Spotify-Diy-Thing/SpotifyDiyThing/logHeartbeat.h
      - Spotify-Diy-Thing/SpotifyDiyThing/secret.h
      - Spotify-Diy-Thing/tools/audit_log_hygiene.sh
    cross_features: [cfg-001, poll-001, time-001, wifi-001, disp-001]
    test_ids: []
    notes: |
      Two known coverage gaps documented in ADR-010 amendments: (a) ESP_LOGx is redefined by Arduino-ESP32 and bypasses esp_log_writev — own LOG_x macros provide a direct Serial+ringbuffer path; (b) Arduino-ESP32 log_e/log_w (ssl_client / WiFiGeneric internals) print via printf and never reach the hook. Tier-2 capture deferred.
      /log HTTP test is gated on a non-AP-isolated network. Build flag CORE_DEBUG_LEVEL=4 required to compile in DEBUG-level calls.

  - id: log-002
    name: On-screen log overlay (debug HUD)
    description: Renders the most-recent ringbuffer lines across the whole 320×240 panel using TFT_eSPI font 1 (6×8 px GLCD), green-on-black. Winamp chrome paints on top via WinampDisplay::repaintChrome — top strip ~7 lines visible (oldest), bottom ~7 (newest), middle ~16 hidden behind chrome. Rate-limited to 4 Hz; dirty-detection via g_head snapshot; SwapBytes saved/restored around drawString.
    status: implemented
    git_ref: Spotify-Diy-Thing@6aa0236
    files:
      - Spotify-Diy-Thing/SpotifyDiyThing/screenLog.h
      - Spotify-Diy-Thing/SpotifyDiyThing/winampDisplay.h
      - Spotify-Diy-Thing/SpotifyDiyThing/SpotifyDiyThing.ino
      - Spotify-Diy-Thing/platformio.ini
    cross_features: [log-001, m3-001, disp-001]
    test_ids: []
    notes: |
      Behind -DSCREEN_LOG / cyd2usb_winamp_screenlog env. Default off; zero overhead when disabled.
      WinampDisplay gained repaintChrome() and currentStatusUv member to support the overlay redraw cycle.

  - id: io-001
    name: Loop responsiveness during blocking Spotify calls (M-IO tier 1)
    description: Per ADR-011. Exponential backoff on consecutive Spotify-poll failures (5 s → 10 → 20 → 40 → 60 s cap, reset on success or touch). Heartbeat exposes block_max_ms — the longest synchronous getCurrentlyPlaying since the last tick, surfaces opaque blocking events.
    status: implemented
    git_ref: Spotify-Diy-Thing@e06bc40 (ADR-011)
    files:
      - Spotify-Diy-Thing/SpotifyDiyThing/spotifyLogic.h
      - Spotify-Diy-Thing/SpotifyDiyThing/winampDisplay.h
      - Spotify-Diy-Thing/SpotifyDiyThing/cheapYellowLCD.h
      - Spotify-Diy-Thing/SpotifyDiyThing/logHeartbeat.h
    cross_features: [poll-001, log-001, touch-001, touch-002]
    test_ids: []
    notes: |
      Tier 1 keeps synchronous IO; tier 2 (async / FreeRTOS worker task) deferred until DUT data shows tier 1 isn't enough.
      Touch (touch-002 + cheapYellowLCD legacy) clears consecutiveSpotifyFailures so user input always escapes the back-off floor.

  - id: touch-002
    name: Skin-region touch (M5)
    description: Replaces touch-001's three-zone (prev/dead/next) mapping with proper hit-testing on the Winamp main-window chrome. Each transport sprite (PREV/PLAY/PAUSE/STOP/NEXT) is its own region; tap on the posbar groove maps to a millisecond seek position via songDuration. Optimistic UI — on touch, songStartMillis is zeroed (pause/stop/prev/next) or re-anchored (seek) so the M4 interpolator obeys the user immediately rather than waiting for a poll round-trip; re-poll deferred ~1.5 s so Spotify has time to commit before the read-back.
    status: implemented
    git_ref: Spotify-Diy-Thing@9f19f68
    files:
      - Spotify-Diy-Thing/SpotifyDiyThing/winampDisplay.h
    cross_features: [m3-001, poll-002, api-002, io-001]
    test_ids: []
    notes: |
      Reads CYD28_TouchR raw point directly; bypasses the cheapYellowLCD legacy handleTouched() globals.
      STOP maps to pause (Spotify has no native stop). Seek-drag with debounce-on-release deferred. Volume / shuffle / repeat sprites deferred (not on rendered chrome).

  - id: vu-001
    name: Decorative VU bars (M6)
    description: Two horizontal bars in the canonical Winamp visualization rect ((24,43,76,6)/(24,50,76,6) window-local). Synthetic envelope per ADR-009 option (e) — slow swell + per-tick noise + 120 BPM beat transient, smoothed with attack/release; LFO ±15% L/R split; decays to zero on is_playing=false. Green/yellow/red color grading by level. 20 Hz tick gate. Dirty-detection on pixel widths skips SPI when bars haven't moved. No real audio data — Spotify Web API doesn't expose it.
    status: implemented
    git_ref: Spotify-Diy-Thing@049c088
    files:
      - Spotify-Diy-Thing/SpotifyDiyThing/vuMeter.h
      - Spotify-Diy-Thing/SpotifyDiyThing/winampDisplay.h
      - Spotify-Diy-Thing/SpotifyDiyThing/SpotifyDiyThing.ino
    cross_features: [m3-001, poll-002, perf-001]
    test_ids: []
    notes: |
      Decoration not visualisation — ADR-009 is explicit about this. No claim to be music-locked.
      Cost surfaced via perf::record("vu.tick", ms); typical < 1 ms per tick when bars don't move (dirty-skip), ~1-3 ms when they do.

  - id: perf-001
    name: Loop-iteration + hot-path performance instrumentation (M-PERF tier 1)
    description: perf.h namespace with record(name, ms) / recordLoop(ms) / loopMaxMs() / worstPathName() / worstPathMs() / stackHwmBytes() / reset(). Heartbeat consumes + resets each tick, adds stack_hwm + loop_max + slow=<name>:Nms fields. .ino wraps the four top-level loop paths (screenlog.tick, display.input, spotify.poll, display.bar). Iterations > 50 ms emit a LOG_W("perf", "iter=Nms ...") line.
    status: implemented
    git_ref: ""
    files:
      - Spotify-Diy-Thing/SpotifyDiyThing/perf.h
      - Spotify-Diy-Thing/SpotifyDiyThing/logHeartbeat.h
      - Spotify-Diy-Thing/SpotifyDiyThing/SpotifyDiyThing.ino
      - Spotify-Diy-Thing/platformio.ini
    cross_features: [log-001, poll-001, m3-001, touch-002]
    test_ids: []
    notes: |
      DUT data captured 2026-05-08. Touch handler `display.input` dominates at up to 4 189 ms / iteration (synchronous Spotify API inside checkForInput). Polling secondary at 1.5–2 s. stack_hwm ≈ 2 380 bytes (comfortable).
      TASK-030 SPI clock A/B (55 MHz → 40 MHz) shipped same commit; user-confirmed flicker improvement on static chrome.

