  - id: sync-001
    name: DUT–Spotify state synchronization (M-SYNC)
    description: |
      Field-level lag bounds + stale-state observability between Spotify's authoritative
      state and the DUT chrome render. Three lag-bound tiers (ADR-022):
      steady-state field change = one poll cycle (5.5 s); degraded = backoff_remaining +
      one poll (≤ 61 s); touch-confirmed = optimistic_window + one poll (3.5–7 s).
      Observability surface: heartbeat fields `last_poll_age_ms` + `next_poll_in_ms`
      (log-001 extension, TASK-058); per-poll structured `[D][spotify.poll] snap ...`
      log line; optimistic-volume-expiry `LOG_D`; track-transition-skip `LOG_W` (deferred).
      Host-side comparator `tools/tsync_diff.py` against the firmware-consumed field set
      from T073.
