# flaky.yaml — the pre-declared flaky set (ADR-059 D13, M-TESTARCH §7)
#
# Owner: @VE
#
# WHY THIS FILE EXISTS. ADR-059 D13 requires a >=3-run behaviour-neutrality
# baseline "with the flaky set pre-declared". The knowledge existed — scattered
# across test docstrings, task notes and one project memory — but the ARTIFACT
# did not, so "pre-declared" was unenforceable and every flake was re-argued
# from scratch. @VE ranked this as the single cheapest change that makes a D13
# baseline mean anything, ABOVE the timeout policy (M-TESTBASE §3.4).
#
# THE POLICY IT IMPLEMENTS (M-TESTARCH §7):
#   1. A flake must be declared HERE, before the run. Calling flake() for an id
#      not in this file is a FAIL, not a flake.
#   2. A declared flake is retried once and BOTH outcomes are reported.
#      PASS(1 retry) is not PASS.
#   3. Every entry carries an owning task and a review date. No date, no flake
#      status — an entry past its review date is a FAIL until re-justified.
#   4. A flake blocks a D13 baseline unless it was declared BEFORE the first
#      baseline run. Otherwise the baseline absorbs the regression it exists to
#      detect.
#
# STATUS: the file is the artifact; the runner does not read it yet. Wiring
# ve_suite_base.flake() to consult it is the next step (TASK-520).

flaky:
  - id: T087
    suite: suite/serialdbg/shell
    since: 2026-08-25
    evidence: "Stable-core across the TASK-480 3-run baseline (1b58194, all 3 runs
      failed) and reproduced again in TASK-480's post-split full-suite parity run
      (bfe36b0). A same-day isolated re-run (TASK-545) FAILED again with a
      DIFFERENT symptom than either of those two, and a second isolated re-run
      minutes later PASSED clean — confirms non-deterministic, not a fixed
      regression tied to one code path."
    symptom: "varies by run — seen: 'SHUFFLE: hit=CANVAS action=NONE' /
      'LOGO-cooldown: hit=CANVAS action=NONE (expected DEADZONE/FORCE_POLL)' /
      'no TLS-reset log line within 8s'; also seen: 'SHUFFLE: hit=DEADZONE
      action=FORCE_POLL; REPEAT: hit=DEADZONE action=FORCE_POLL' — different
      hit-test/action pairs fail across runs, not one fixed assertion"
    dependency: "[TIMING] — multi-region hit-test + TLS-reset log race; this rig
      runs under a live 403 (TASK-243, Premium lapsed) which already degrades the
      spotifyTask/TLS timing paths T087 depends on"
    suspected: "cooldown/timing race in the multi-tap sequence, not attributable
      to TASK-480 (byte-for-byte code move, no logic changed) — same symptom
      class observed pre-split in the 3-run baseline"
    owner: "@VE"
    task: TASK-545
    review_by: 2026-09-26

